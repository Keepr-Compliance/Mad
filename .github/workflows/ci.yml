name: CI/CD

# Branching Strategy:
# - main: Production-ready code, triggers packaging/releases
# - develop: Integration branch for next release
# - feature/*, fix/*, claude/*: Feature branches
#
# Merge Policy: Always use traditional merges (not squash) to retain commit history

# BACKLOG-2506 (defect 1): ONE event owns PR validation.
#
# `push` used to list feature/**, fix/**, claude/** and docs/**, while
# `pull_request` lists the bases those branches target. A PR from fix/** to
# develop therefore matched BOTH, and the entire workflow ran TWICE on the same
# commit — observed on PR #2213 at 06:52:11 (push) and 06:52:13 (pull_request).
#
# That was not merely wasteful. The two runs were not equivalent (see the OS
# matrix step below), and each emitted its own copy of every status check, so a
# commit carried up to four check runs named `Security Audit`. Branch protection
# resolves a required context to the LATEST check run of that name, so it could
# land on a `skipped` twin and refuse the merge while the UI showed all green.
# That is what left PR #2213 BLOCKED with 23 passing checks and zero failures.
#
# Now: pushes are validated only on the two long-lived branches; every branch
# under review is validated by the `pull_request` event, which is also the event
# that computes the correct (both-OS) matrix.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'int/**']

jobs:
  # Fast check to determine if we can skip heavy CI jobs
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      os-matrix: ${{ steps.os.outputs.os-matrix }}
      android-changed: ${{ steps.android.outputs.android-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Fetch all history for proper branch comparison

      - name: Fetch base branch for PR comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      - name: Check for docs-only changes
        id: filter
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if all changes are docs/markdown only
          #
          # BACKLOG-2506 (defect 4): `.github/workflows/*` USED TO BE ON THIS LIST.
          # A PR whose only change was to ci.yml was therefore classified
          # docs-only, the whole test job was skipped, and the PR merged green
          # having run nothing. A workflow edit is the opposite of a no-risk
          # change: its blast radius is every subsequent PR on the repo, and a
          # broken edit could not be caught by the very thing it broke.
          #
          # Issue and PR templates stay — those are genuinely inert.
          DOCS_ONLY="true"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                *.md|.claude/*|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE/*|LICENSE|*.txt)
                  # Documentation or config file, continue
                  ;;
                *)
                  # Non-docs file found
                  DOCS_ONLY="false"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "docs-only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          echo "Result: docs-only=$DOCS_ONLY"

      - name: Check for android-companion changes
        id: android
        run: |
          # Same diff basis as the docs-only filter above (base already fetched)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          fi

          # true if ANY changed file lives under android-companion/
          ANDROID_CHANGED="false"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                android-companion/*)
                  ANDROID_CHANGED="true"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "android-changed=$ANDROID_CHANGED" >> $GITHUB_OUTPUT
          echo "Result: android-changed=$ANDROID_CHANGED"

      - name: Determine OS matrix
        id: os
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # PRs (to develop/main/int/*) and pushes to develop/main: both macOS + Windows.
          #
          # BACKLOG-2506 (defect 2): the final branch is now unreachable, and that
          # is the point. It used to fire for pushes to feature/fix/claude
          # branches and emit a macOS-ONLY matrix. Because those pushes also
          # raced a pull_request run (defect 1), a commit got two runs whose
          # matrices differed: on PR #2213 the push run produced no
          # `Test & Lint (windows-latest, 20.x)` job at all, while reporting the
          # other checks under the same names as the full run. A weaker run was
          # impersonating the real one.
          #
          # With `push` now limited to main/develop, EVENT_NAME=pull_request or
          # GITHUB_REF_NAME in (main, develop) covers every case. The branch is
          # kept as a defensive default rather than deleted, so an unforeseen
          # trigger degrades to a real (if narrower) run instead of an empty matrix.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'os-matrix=["macos-latest","windows-latest"]' >> $GITHUB_OUTPUT
            echo "OS: both (pull_request)"
          elif [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]; then
            echo 'os-matrix=["macos-latest","windows-latest"]' >> $GITHUB_OUTPUT
            echo "OS: both (push to $GITHUB_REF_NAME)"
          else
            echo 'os-matrix=["macos-latest"]' >> $GITHUB_OUTPUT
            echo "OS: macOS only (push to feature branch)"
          fi

  # BACKLOG-2506 (defect 3): there used to be a `docs-pass` job here, ALSO named
  # `Test & Lint`, with a matching matrix, gated on the inverse `if`. The comment
  # on it read "Matrix must match the real test job to produce identical status
  # check names" — which is exactly the problem.
  #
  # A job whose `if` is false is SKIPPED, not absent: GitHub still creates a check
  # run for it. So every commit got TWO check runs per name, one real and one
  # `skipped`, and required-check resolution (latest run of that name) could land
  # on the skipped one and block the merge.
  #
  # Worse for trust: on a docs-only change the twin reported
  # `Test & Lint (macos-latest, 20.x)` GREEN in about four seconds having run no
  # tests, indistinguishable by name or conclusion from the seven-minute real run.
  # A required check could be satisfied by a job that tested nothing.
  #
  # The pair is now ONE job that always runs, so exactly one check run carries
  # each required name. The docs-only skip moved from the job's `if` to the
  # steps', so the reason a run was cheap is visible in its log instead of being
  # hidden behind an identically-named impostor.
  #
  # The name and matrix below are LOAD-BEARING: `Test & Lint` x (os, node-version)
  # is what produces `Test & Lint (macos-latest, 20.x)` and
  # `Test & Lint (windows-latest, 20.x)`, both registered as required contexts on
  # develop. Do not rename either, or reorder the matrix keys.
  test:
    name: Test & Lint
    needs: check-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Prevent CI from running indefinitely

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}
        node-version: [20.x]  # Node 18 dropped - better-sqlite3-multiple-ciphers requires Node 20+

    steps:
      # BACKLOG-2506: the docs-only skip lives here now, on every step, instead
      # of on the job. The job always runs so its check-run names always exist;
      # this step is what makes a cheap run legible as a skip in the log.
      - name: Note docs-only change (tests skipped)
        if: needs.check-changes.outputs.docs-only == 'true'
        run: echo "Documentation-only change detected - test steps skipped for ${{ matrix.os }} / Node ${{ matrix.node-version }}"

      - name: Checkout code
        if: needs.check-changes.outputs.docs-only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.check-changes.outputs.docs-only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Python setuptools
        if: needs.check-changes.outputs.docs-only != 'true'
        run: pip install setuptools

      - name: Install dependencies
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm run build:preload

      - name: Rebuild native modules for Electron
        if: needs.check-changes.outputs.docs-only != 'true'
        run: node scripts/rebuild-native.js
        continue-on-error: true

      - name: TypeScript type check
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm run type-check

      - name: Run linter
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm run lint

      - name: Run tests
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm test -- --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB --forceExit
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-1786: integration tier (business-critical pipeline: sync ->
      # classification -> detection). Runs as its own step via a dedicated config
      # so a failure here is not masked by the unit run, and vice-versa. Reuses the
      # already-installed deps + rebuilt native modules from the steps above and
      # inherits the macOS + Windows matrix. No --forceExit: this tier is verified
      # to leak no open handles, so we want jest to fail loudly if that changes.
      - name: Run integration test tier
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm run test:integration -- --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # broker-portal jest suite (BACKLOG-2005a re-enabled it: config + route tests now
      # exist). Runs from the repo root so ts-jest / jest-environment-* resolve from the
      # hoisted root node_modules; the portal config remaps @/ to the portal root.
      - name: Run broker-portal tests
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npx jest --config broker-portal/jest.config.js --silent
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run admin-portal tests
        if: needs.check-changes.outputs.docs-only != 'true'
        working-directory: admin-portal
        run: npx vitest run
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # BACKLOG-2485: block personal-looking data from entering source/test paths.
  # This repository is public, so a fixture containing a real person's address or
  # phone number is permanently republished to every clone and fork the moment it
  # lands. Deliberately NOT gated on docs-only: the check is a few seconds of pure
  # node with no install step, and it must always report a status.
  fixture-pii:
    name: Fixture PII Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Scan fixtures for personal data
        run: npm run check:pii

  # BACKLOG-1750: gate the @keepr/ui shared component library. Isolated,
  # platform-agnostic job (single OS, no native modules) — the root `test` job
  # excludes packages/ (see jest.config.js testPathIgnorePatterns), so without
  # this the library would have no CI regression protection. ignore-scripts skips
  # the electron/native postinstall the package doesn't need.
  packages-ui:
    name: UI Package (@keepr/ui)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Type check (@keepr/ui)
        run: npm run type-check -w @keepr/ui

      - name: Lint (@keepr/ui)
        run: npm run lint -w @keepr/ui

      - name: Test (@keepr/ui)
        run: npm test -w @keepr/ui

  # BACKLOG-2221: gate the Expo/React Native companion (android-companion/). It has
  # its own package-lock + jest/eslint/tsc but no root CI job covered it, so SMS
  # pipeline / crypto regressions went uncaught. Isolated job (own lockfile, no
  # native rebuild).
  #
  # BACKLOG-2506 (defect 3): there was a mirror job `android-companion-skip`,
  # also named `Android Companion`, gated on the inverse `if`, so the status
  # check name was reported on PRs that don't touch android-companion/**. Its own
  # comment said "Exactly one of the two runs" — but a skipped job still produces
  # a check run, so BOTH reported, one `success` and one `skipped`, under one
  # name. Merged into this job: the check name is always present (which was the
  # original goal) and now appears exactly once.
  #
  # `Android Companion` is not currently a required context, but it was written
  # to be "ready to be made a required check" — as a duplicate name it would have
  # wedged every PR the moment it was promoted.
  android-companion:
    name: Android Companion
    needs: check-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-companion
    steps:
      # No working-directory dependency: this runs before checkout, when
      # android-companion/ does not exist yet on the runner.
      - name: Note no android-companion changes (checks skipped)
        if: needs.check-changes.outputs.android-changed != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No android-companion changes detected - android-companion checks skipped"

      - name: Checkout code
        if: needs.check-changes.outputs.android-changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        if: needs.check-changes.outputs.android-changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: android-companion/package-lock.json

      - name: Install dependencies
        if: needs.check-changes.outputs.android-changed == 'true'
        run: npm ci

      - name: Run tests
        if: needs.check-changes.outputs.android-changed == 'true'
        run: npm test

      - name: TypeScript type check
        if: needs.check-changes.outputs.android-changed == 'true'
        run: npx tsc --noEmit

      - name: Run linter
        if: needs.check-changes.outputs.android-changed == 'true'
        run: npm run lint

  build:
    name: Build Application
    runs-on: ${{ matrix.os }}
    needs: [check-changes, test]
    if: needs.check-changes.outputs.docs-only != 'true'

    strategy:
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  # BACKLOG-2506 (defect 3): `security-pass` — a second job ALSO named
  # `Security Audit`, gated on the inverse `if` — was merged into this one. A
  # false `if` skips a job but still creates a check run, so the pair emitted a
  # duplicate `skipped` result under the required name. Combined with the
  # double-trigger that put FOUR check runs named `Security Audit` on a single
  # commit (two success, two skipped) — which is what branch protection was
  # resolving against when it refused PR #2213.
  #
  # `Security Audit` is a registered required context on develop. This job must
  # always run: do NOT restore a job-level `if`, or a docs-only PR will report no
  # such check at all and wedge permanently.
  security:
    name: Security Audit
    needs: check-changes
    runs-on: ubuntu-latest

    steps:
      - name: Note docs-only change (audit skipped)
        if: needs.check-changes.outputs.docs-only == 'true'
        run: echo "Documentation-only change detected - security audit skipped"

      - name: Checkout code
        if: needs.check-changes.outputs.docs-only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        if: needs.check-changes.outputs.docs-only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'

      - name: Run npm audit
        if: needs.check-changes.outputs.docs-only != 'true'
        # audit-level=critical: 72 known high/moderate vulnerabilities from transitive
        # dependencies (minimatch, ajv, tar, qs, next) tracked in BACKLOG-723.
        # None are critical. Will lower to --audit-level=high once dependencies are updated.
        # BACKLOG-2265: npm is retiring the audits/quick endpoint (400 "endpoint is being
        # retired"), which was hard-failing this required check repo-wide. Tolerate ONLY that
        # class of registry/endpoint infra error; a real critical vulnerability still fails.
        run: |
          set +e
          OUT=$(npm audit --audit-level=critical 2>&1); CODE=$?
          echo "$OUT"
          if echo "$OUT" | grep -qiE "endpoint is being retired|Invalid package tree|400 Bad Request|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up"; then
            echo "::warning::npm audit hit a registry/endpoint infra error (BACKLOG-2265) — treating as non-fatal. Real critical vulnerabilities still fail this step."
            exit 0
          fi
          exit $CODE

      - name: Check for outdated dependencies
        if: needs.check-changes.outputs.docs-only != 'true'
        run: npm outdated
        continue-on-error: true

  # Package on main (production) and develop (staging) branches
  package:
    name: Package Application
    runs-on: ${{ matrix.os }}
    needs: [check-changes, test, build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.check-changes.outputs.docs-only != 'true'

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: |
          echo "::group::Package Configuration"
          echo "Checking code signing configuration..."
          if [ -n "$MACOS_CERT" ]; then
            echo "✓ Code signing certificate: configured"
            echo "✓ Certificate password: $([ -n "$MACOS_CERT_PASSWORD" ] && echo 'configured' || echo 'not set')"
            echo "✓ Apple ID: $([ -n "$APPLE_ID" ] && echo 'configured' || echo 'not set')"
            echo "✓ Apple Team ID: $([ -n "$APPLE_TEAM_ID" ] && echo 'configured' || echo 'not set')"
            echo "::endgroup::"
            echo ""
            echo "Building signed package..."
            export CSC_LINK="$MACOS_CERT"
            export CSC_KEY_PASSWORD="$MACOS_CERT_PASSWORD"
            if ! npm run package 2>&1 | tee package.log; then
              echo "::error::Package build failed. Check package.log for details."
              cat package.log
              exit 1
            fi
          else
            echo "✗ Code signing certificate: not configured"
            echo "::warning::Building unsigned package - code signing secrets not configured"
            echo "::endgroup::"
            echo ""
            echo "Building unsigned package..."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if ! npm run package:unsigned 2>&1 | tee package.log; then
              echo "::error::Unsigned package build failed. Check package.log for details."
              cat package.log
              exit 1
            fi
          fi
          echo ""
          echo "::group::Build Artifacts"
          ls -la dist/*.dmg dist/*.zip 2>/dev/null || echo "No package artifacts found"
          echo "::endgroup::"
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Download and extract Apple drivers (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Downloading iTunes installer to extract Apple Mobile Device Support..."

          # Download iTunes installer
          $iTunesUrl = "https://www.apple.com/itunes/download/win64"
          $installerPath = "$env:TEMP\iTunes64Setup.exe"
          $extractPath = "$env:TEMP\iTunes-extracted"
          $targetPath = "resources\win\apple-drivers"

          echo "Downloading from $iTunesUrl..."
          Invoke-WebRequest -Uri $iTunesUrl -OutFile $installerPath -UseBasicParsing

          echo "Download complete. Size: $((Get-Item $installerPath).Length / 1MB) MB"

          # Extract using 7-Zip (pre-installed on GitHub runners)
          echo "Extracting with 7-Zip..."
          7z x $installerPath -o"$extractPath" -y

          # Find the MSI
          echo "Looking for AppleMobileDeviceSupport MSI..."
          $msi = Get-ChildItem -Path $extractPath -Recurse -Filter "AppleMobileDeviceSupport*.msi" | Select-Object -First 1

          if ($msi) {
            echo "Found: $($msi.FullName)"

            # Ensure target directory exists
            New-Item -ItemType Directory -Force -Path $targetPath | Out-Null

            # Copy MSI to resources
            Copy-Item $msi.FullName -Destination "$targetPath\AppleMobileDeviceSupport64.msi"

            # Create version file
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($msi.FullName).FileVersion
            if (-not $version) { $version = "unknown" }
            Set-Content -Path "$targetPath\version.txt" -Value $version

            echo "Apple drivers extracted successfully!"
            echo "MSI: $targetPath\AppleMobileDeviceSupport64.msi"
            echo "Version: $version"
          } else {
            echo "::warning::Could not find AppleMobileDeviceSupport MSI in extracted files"
            echo "Extracted contents:"
            Get-ChildItem -Path $extractPath -Recurse | Select-Object FullName
          }

          # Cleanup
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "Building Windows package..."
          npm run package:unsigned
          echo "Build complete. Checking artifacts..."
          Get-ChildItem -Path dist -Filter "*.exe" | Format-Table Name, Length
        shell: pwsh

      - name: Upload macOS package artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Upload Windows package artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.exe
          retention-days: 30

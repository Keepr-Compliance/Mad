name: CI/CD

# Branching Strategy:
# - main: Production-ready code, triggers packaging/releases
# - develop: Integration branch for next release
# - feature/*, fix/*, claude/*: Feature branches
#
# Merge Policy: Always use traditional merges (not squash) to retain commit history

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'claude/**', 'docs/**']
  pull_request:
    branches: [main, develop, 'int/**']

jobs:
  # Fast check to determine if we can skip heavy CI jobs
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      os-matrix: ${{ steps.os.outputs.os-matrix }}
      android-changed: ${{ steps.android.outputs.android-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Fetch all history for proper branch comparison

      - name: Fetch base branch for PR comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      - name: Check for docs-only changes
        id: filter
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if all changes are docs/markdown only
          DOCS_ONLY="true"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                *.md|.claude/*|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE/*|.github/workflows/*|LICENSE|*.txt)
                  # Documentation or config file, continue
                  ;;
                *)
                  # Non-docs file found
                  DOCS_ONLY="false"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "docs-only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          echo "Result: docs-only=$DOCS_ONLY"

      - name: Check for android-companion changes
        id: android
        run: |
          # Same diff basis as the docs-only filter above (base already fetched)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          fi

          # true if ANY changed file lives under android-companion/
          ANDROID_CHANGED="false"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                android-companion/*)
                  ANDROID_CHANGED="true"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "android-changed=$ANDROID_CHANGED" >> $GITHUB_OUTPUT
          echo "Result: android-changed=$ANDROID_CHANGED"

      - name: Determine OS matrix
        id: os
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # PRs (to develop/main/int/*) and pushes to develop/main: run both macOS + Windows
          # Pushes to feature/fix/claude branches: macOS only (Windows runs on the PR)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'os-matrix=["macos-latest","windows-latest"]' >> $GITHUB_OUTPUT
            echo "OS: both (pull_request)"
          elif [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" ]]; then
            echo 'os-matrix=["macos-latest","windows-latest"]' >> $GITHUB_OUTPUT
            echo "OS: both (push to $GITHUB_REF_NAME)"
          else
            echo 'os-matrix=["macos-latest"]' >> $GITHUB_OUTPUT
            echo "OS: macOS only (push to feature branch)"
          fi

  # For docs-only changes, provide passing status checks without running heavy tests
  # Matrix must match the real test job to produce identical status check names
  docs-pass:
    name: Test & Lint
    needs: check-changes
    if: needs.check-changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}
        node-version: [20.x]
    steps:
      - name: Skip tests (docs-only change)
        run: echo "Skipping tests for ${{ matrix.os }} / Node ${{ matrix.node-version }} - documentation-only changes detected"

  test:
    name: Test & Lint
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Prevent CI from running indefinitely

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}
        node-version: [20.x]  # Node 18 dropped - better-sqlite3-multiple-ciphers requires Node 20+

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      - name: Rebuild native modules for Electron
        run: node scripts/rebuild-native.js
        continue-on-error: true

      # BACKLOG-2505: NODE_OPTIONS on the next three steps.
      #
      # Every step from "Run tests" down already sets --max-old-space-size=4096.
      # These three did not, so they ran on whatever old-space limit Node derives
      # from the runner's total memory. `type-check:tests` needs ~2 GB, which put
      # it right at that derived limit: it OOM'd (exit 134, node::OOMErrorHandler)
      # on two consecutive re-runs of an UNCHANGED commit on PR #2212, having
      # passed on an earlier run of the same commit.
      #
      # Value and shape are copied from the sibling steps rather than tuned, so
      # every Node step in this job now carries one explicit, identical limit
      # instead of an implicit one that varies with the runner.
      - name: TypeScript type check
        run: npm run type-check
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-2414: `npm run type-check` uses tsconfig.json, which EXCLUDES
      # **/*.test.* — so the entire test suite was never type-checked by anything.
      # A literal `const x: number = "string"` in a test file passed tsc, eslint and
      # jest simultaneously. This step closes that hole; it is a separate step (not
      # folded into type-check) so a failure names the test suite explicitly.
      - name: TypeScript type check (test suite)
        # BACKLOG-2505: print the limit actually in force before running. This is
        # the step that OOM'd, and a green run on its own cannot tell "the cap
        # applied" from "the OOM did not fire this time" — the printed number can.
        # It reads V8's own limit, so it tracks the flag rather than echoing it.
        run: |
          node -p "'v8 heap_size_limit: ' + Math.round(require('v8').getHeapStatistics().heap_size_limit / 1048576) + ' MB'"
          npm run type-check:tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run linter
        run: npm run lint
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run tests
        run: npm test -- --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB --forceExit
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-1786: integration tier (business-critical pipeline: sync ->
      # classification -> detection). Runs as its own step via a dedicated config
      # so a failure here is not masked by the unit run, and vice-versa. Reuses the
      # already-installed deps + rebuilt native modules from the steps above and
      # inherits the macOS + Windows matrix. No --forceExit: this tier is verified
      # to leak no open handles, so we want jest to fail loudly if that changes.
      - name: Run integration test tier
        run: npm run test:integration -- --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # broker-portal jest suite (BACKLOG-2005a re-enabled it: config + route tests now
      # exist). Runs from the repo root so ts-jest / jest-environment-* resolve from the
      # hoisted root node_modules; the portal config remaps @/ to the portal root.
      - name: Run broker-portal tests
        run: npx jest --config broker-portal/jest.config.js --silent
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run admin-portal tests
        working-directory: admin-portal
        run: npx vitest run
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # BACKLOG-2485: block personal-looking data from entering source/test paths.
  # This repository is public, so a fixture containing a real person's address or
  # phone number is permanently republished to every clone and fork the moment it
  # lands. Deliberately NOT gated on docs-only: the check is a few seconds of pure
  # node with no install step, and it must always report a status.
  fixture-pii:
    name: Fixture PII Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # BACKLOG-2871: the bare-uuid rule reads the ADDED LINES of the commits
          # under review, so this job needs history. The default depth-1 checkout
          # has no base commit to diff against and the rule would silently check
          # nothing.
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      # The tree rules (email / phone / name) always run. The bare-uuid rule needs
      # a commit range, which is derived here.
      #
      # THIS JOB IS ALLOWED TO DEGRADE; THE PRE-PUSH HOOK IS NOT. On a PUBLIC repo
      # CI runs after the object already exists on GitHub, so this job is a
      # notification and the hook is the gate. When no range can be derived, this
      # says so loudly and still runs the tree scan, rather than failing a build
      # for a reason unrelated to the diff. `.husky/pre-push` fails CLOSED on the
      # same condition, on purpose.
      - name: Derive the commit range under review
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -u
          range=""
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            range="$PR_HEAD --not $PR_BASE"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$(echo "$PUSH_BEFORE" | tr -d '0')" != "" ]; then
            # A non-zero `before` means this push had a predecessor on the branch.
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$GITHUB_SHA --not $PUSH_BEFORE"
            fi
          fi
          if [ -z "$range" ]; then
            echo "::warning title=Fixture PII Scan::No commit range could be derived (new branch, force-push, or first push). The bare-uuid rule checked NOTHING on this run; the tree rules still ran. The pre-push hook is the gate for this rule."
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan fixtures for personal data
        env:
          PII_RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -u
          if [ -n "${PII_RANGE:-}" ]; then
            node scripts/ci/check-fixture-pii.mjs --diff-range "$PII_RANGE"
          else
            npm run check:pii
          fi

      # BACKLOG-2871: the guard's own verification harness. It existed since
      # BACKLOG-2657 and NOTHING RAN IT -- not CI, not package.json, not the hook.
      # A verification harness that never executes is indistinguishable from one
      # that passes, which is the exact failure this repo keeps filing.
      - name: Verify the guard itself
        run: npm run verify:pii

  # BACKLOG-2678: fail the build when a tracked test file is run by NO CI test config.
  #
  # jest.config.js used different testMatch lists under CI and locally, so a file matched only by
  # the local list ran on developer machines and in the pre-push hook and NEVER in CI — 47 of 622
  # tracked test files, 31 of them the QA harness's own suites, with nothing able to report it.
  # Converging the globs closed that day's gap; this job is what stops it reopening.
  #
  # Deliberately NOT gated on docs-only, and deliberately WITHOUT `needs: check-changes`: the
  # docs-only filter treats `.github/workflows/*` as documentation, so a workflow-only PR would
  # skip this job — which is precisely how a gate gets disabled without anyone noticing
  # (cf. BACKLOG-2506: duplicated job names and a push leg that emitted no Windows job, all merged
  # green). It must always run and always report a status.
  #
  # Unique job name + unique status-check name. Do NOT add a second job with this name.
  test-drift:
    name: Test Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'

      # The gate asks each runner to list its own tests rather than reimplementing glob matching,
      # so jest/vitest must be installed. ignore-scripts skips the electron/native rebuild — test
      # DISCOVERY needs no native module and no app build.
      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      # android-companion is NOT an npm workspace (own package-lock, jest-expo preset), so the root
      # install does not provide its node_modules. Without this, its probe reports DEAD and its 30
      # test files look orphaned.
      - name: Install android-companion dependencies
        working-directory: android-companion
        run: npm ci
        env:
          npm_config_ignore_scripts: true

      - name: Check for orphaned test files
        run: node scripts/ci/check-test-drift.mjs

  # BACKLOG-2577: hook infrastructure requires branch-independence, and tracking
  # is definitionally branch-dependence. Committing anything under .husky/_ makes
  # the runner directory disappear on a checkout of any branch without it, which
  # silently disables pre-push and pre-commit repo-wide (exit 0, no warning).
  # This job is the standing rule preventing that packaging from returning.
  # No npm install: the check reads the git index only, and husky's installer
  # would write core.hooksPath as a side effect if it ran in CI.
  hooks-tracking:
    name: Hooks Tracking Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Assert nothing under .husky/_ is tracked
        run: npm run check:hooks

  # BACKLOG-2959: SQL text belongs in electron/services/db/** (the *Sql.ts
  # pattern). This gate fails when a NEW site defines SQL text anywhere else.
  #
  # It matches .prepare(, .exec( AND .pragma(. A .prepare(-only gate is
  # decorative: it would pass a file holding raw db.exec() DDL, which is the
  # PR-SOP 6.2e failure this gate exists to end.
  #
  # Classification is an AST walk, not a grep: 41% of the tree's call sites put
  # argument 0 on a following line, where a line-oriented grep cannot see it.
  # It classifies argument 0's ORIGIN, not the receiver name, so RegExp.exec is
  # green without a name blacklist, and SQL hoisted into a local const is red.
  #
  # Deliberately NOT gated on docs-only and carrying no `needs:`. The docs-only
  # filter at the top of this file treats `.github/workflows/*` as
  # documentation, so a workflow-only PR skips every job that depends on
  # check-changes — which is precisely how a gate gets switched off without
  # anyone noticing (cf. the test-drift and text-sources jobs, same shape, same
  # reason). It must always run and always report a status.
  #
  # Unique job name + unique status-check name. Do NOT add a second job with
  # this name.
  sql-boundary:
    name: SQL Boundary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'

      # The gate parses TypeScript with the compiler API, so `typescript` must be
      # installed. ignore-scripts skips the electron/native rebuild: parsing needs
      # no native module and no app build.
      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Assert no SQL text is defined outside the db layer
        run: npm run check:sql-boundary

      # The guard's own verification harness. A harness that never executes is
      # indistinguishable from one that passes -- the failure this repo keeps
      # filing (cf. "Verify the guard itself" on the fixture-pii job).
      - name: Verify the guard itself
        run: npm run verify:sql-boundary

  # BACKLOG-2637: a source file holding a raw NUL is classified as binary by the
  # search tools, which then omit it from every repo-wide sweep WITHOUT warning
  # and WITHOUT a non-zero exit. The result is not a slow search or a failed one
  # — it is a clean-looking negative, and nothing anywhere says the file was
  # skipped. It happened twice in one epic and both times a person found it by
  # running `file` on a hunch, not by any check.
  #
  # Scope is repository-wide on purpose. The narrow first draft (electron/ and
  # src/) left 691 of 2,051 tracked .ts/.tsx unchecked — a third of the
  # TypeScript — and the clinching case is the guard script itself, which
  # acquired the defect during its own development and lives in scripts/.
  #
  # Detection is a strict read of every tracked TS/JS file, NOT `file(1)`: file
  # reads a prefix, and was measured calling a 200 KB file with a NUL at offset
  # 150,000 "ASCII text" while that file was silently unsearchable. The same pass
  # catches invalid UTF-8, which git cannot see and which ugrep — what `grep`
  # resolves to in the agent shell — also skips silently. 2,121 files in ~0.7s.
  #
  # Deliberately NOT gated on docs-only: no install step, and it must always
  # report a status.
  text-sources:
    name: Text Source Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Assert every tracked TS/JS file is searchable
        run: npm run check:text-sources

  # BACKLOG-1750: gate the @keepr/ui shared component library. Isolated,
  # platform-agnostic job (single OS, no native modules) — the root `test` job
  # excludes packages/ (see jest.config.js testPathIgnorePatterns), so without
  # this the library would have no CI regression protection. ignore-scripts skips
  # the electron/native postinstall the package doesn't need.
  packages-ui:
    name: UI Package (@keepr/ui)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Type check (@keepr/ui)
        run: npm run type-check -w @keepr/ui

      - name: Lint (@keepr/ui)
        run: npm run lint -w @keepr/ui

      - name: Test (@keepr/ui)
        run: npm test -w @keepr/ui

  # BACKLOG-2221: gate the Expo/React Native companion (android-companion/). It has
  # its own package-lock + jest/eslint/tsc but no root CI job covered it, so SMS
  # pipeline / crypto regressions went uncaught. Isolated job (own lockfile, no
  # native rebuild). Runs only when android-companion/** changed; the mirror-skip
  # job below keeps the status check name present on PRs that don't touch it — the
  # same docs-pass/test idiom used above.
  android-companion:
    name: Android Companion
    needs: check-changes
    if: needs.check-changes.outputs.android-changed == 'true'
    runs-on: ubuntu-latest
    # BACKLOG-3051: left at 15, having measured rather than guessed.
    #
    # Adding the Kotlin compile below took this job from 67s to 5m11s. Three cold
    # measurements: 5m01s (job 100516186527), 5m04s (100516984179), 5m11s
    # (100517522851). Every one executes 45/45 tasks, so cold-runner cost is
    # already inside the number rather than being a first-run penalty later runs
    # would avoid.
    #
    # This job caches nothing under ~/.gradle today, but do NOT read that as
    # "there is nothing to cache" — an earlier version of this comment said so
    # and it was wrong. SR review of PR #2475 segmented job 100517522851: the
    # distribution download is only 4.2s of the 234s, while ~140s is Gradle
    # plugin compilation and dependency resolution, both of which live in
    # ~/.gradle and are exactly what a cache restores. Whether caching pays
    # needs its own measurement; it is filed, not done here.
    #
    # 15 minutes is ~2.9x the measured cold job. This value was briefly raised to
    # 25 before the number existed; the number says the raise was not needed.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-companion
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: android-companion/package-lock.json

      # Pinned rather than inherited. The runner image ships several JDKs and its
      # default has moved before; the Android Gradle Plugin and Kotlin toolchain
      # used here are on 17, and "whatever the image defaults to" is not a version.
      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      # BACKLOG-3051 — the only step in this repo that reads a line of Kotlin.
      #
      # `modules/keepr-mms/.../KeeprMmsModule.kt` is 331 lines of provider access
      # that jest, tsc and eslint are all structurally blind to. Measured on
      # int/android-mms @ 7dac99d6b, with the module's sort constant flipped from
      # "date ASC" to "date DESC" — the mutation that permanently strands message
      # history (BACKLOG-2199):
      #
      #     npx jest --bail=0  ->  54 suites, 706 passed, 706 total
      #     npx tsc --noEmit   ->  exit 0
      #     npx eslint .       ->  0 errors
      #
      # Every gate green. A file that no longer PARSES would have merged the same
      # way. The sibling jest suite (modules/keepr-mms/__tests__) now pins the two
      # constants as source text, but a text assertion cannot see a broken parse,
      # a projection naming a column the provider lacks, or a type error — those
      # need the compiler, which is this step.
      #
      # WHAT THIS STEP DOES AND DOES NOT DO. It turns a broken parse into a
      # visible RED check on the PR. It does NOT block the merge: read from the
      # API on 2026-09-02, develop's required contexts are exactly "Test & Lint
      # (macos-latest, 20.x)", "Test & Lint (windows-latest, 20.x)", "Security
      # Audit" and "Fixture PII Scan" (strict: true), and int/android-mms has no
      # branch protection at all (/protection -> 404).
      # "Android Companion" is not a required context, so a red compile step
      # shows an X and merges anyway. The android-companion-skip mirror below
      # exists to make this check REQUIREABLE; making it required is a
      # repository-settings change and is filed separately. Commit 3ae139e60's
      # subject line overstates this — the mechanism is a red check, not a gate.
      #
      # PREBUILD IS NOT OPTIONAL. android-companion/ is a MANAGED Expo project:
      # `/android/` is gitignored (see its .gitignore) and `git ls-files
      # android-companion/android` returns nothing. There is no gradlew in the
      # repo to invoke — it is prebuild output, so the task the BACKLOG-3051 item
      # body prescribed (`./gradlew :keepr-mms:assembleDebug`) could not have run.
      #
      # `--no-install` because `npm ci` already ran above; without it prebuild
      # reinstalls the whole dependency tree.
      - name: Generate the native Android project (prebuild)
        run: npx expo prebuild --platform android --no-install

      # `compileDebugKotlin`, NOT `assembleDebug`: the goal is the compiler's
      # verdict on this module, not a packaged AAR. Assembling additionally runs
      # resource merging, lint and packaging for output nothing consumes.
      #
      # `--no-daemon` because a one-shot CI container gains nothing from a daemon
      # it immediately discards. `--console=plain` keeps the log greppable.
      #
      # Verified this task really compiles the file rather than reporting a
      # vacuous success:
      #   - locally (macOS, JDK 17) it emits modules/keepr-mms/android/build/tmp/
      #     kotlin-classes/debug/expo/modules/keeprmms/KeeprMmsModule*.class
      #   - in CI (job 100516186527) the log carries a bare
      #     "> Task :keepr-mms:compileDebugKotlin" with no UP-TO-DATE or
      #     FROM-CACHE suffix, and "45 actionable tasks: 45 executed"
      #   - deleting one closing brace fails it with
      #     "e: ... KeeprMmsModule.kt:331:2 Syntax error: Missing '}" and exit 1
      - name: Compile the keepr-mms Kotlin module
        working-directory: android-companion/android
        run: ./gradlew :keepr-mms:compileDebugKotlin --no-daemon --console=plain

  # Mirror of android-companion for PRs that do NOT touch android-companion/**, so
  # the "Android Companion" status check is always reported (ready to be made a
  # required check without blocking unrelated PRs). Exactly one of the two runs.
  android-companion-skip:
    name: Android Companion
    needs: check-changes
    if: needs.check-changes.outputs.android-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no android-companion changes)
        run: echo "Skipping android-companion checks - no android-companion changes detected"

  # BACKLOG-2956: `expo.version` sat at "1.0.0" across 54 commits and
  # `expo.android.versionCode` was never set at all. Expo silently defaults
  # versionCode to 1, so EVERY companion build ever produced identified itself as
  # version 1 — which is how a five-month-old debug APK reached a field tester
  # with no way to tell it apart from a build made that morning (BACKLOG-2955).
  #
  # Setting the numbers once fixed that day. This gate is what stops it recurring
  # when nobody remembers. It fails a PR that changes shipping code under
  # android-companion/ without bumping versionCode. Docs, tests and lint/type
  # config are exempt (see NON_SHIPPING in the script) so the rule stays narrow
  # enough that nobody is tempted to reach for --no-verify (BACKLOG-2837).
  #
  # fetch-depth: 0 + the explicit base fetch are required: the check diffs against
  # the MERGE BASE, so the branch is asked "do you bump it" rather than every
  # individual commit being asked.
  android-version-bump:
    name: Android Version Bump Gate
    needs: check-changes
    if: needs.check-changes.outputs.android-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch base branch for comparison
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
          else
            git fetch origin develop || true
          fi

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      # No npm install: the check reads git and two JSON files only.
      - name: Assert expo.android.versionCode was bumped
        env:
          GATE_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: npm run check:android-version

  # Mirror of android-version-bump for PRs that do NOT touch android-companion/**,
  # so the status check is always reported and can be made required without
  # blocking unrelated PRs. Exactly one of the two runs. Same shape as
  # android-companion / android-companion-skip above.
  android-version-bump-skip:
    name: Android Version Bump Gate
    needs: check-changes
    if: needs.check-changes.outputs.android-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no android-companion changes)
        run: echo "Skipping android version-bump gate - no android-companion changes detected"

  build:
    name: Build Application
    runs-on: ${{ matrix.os }}
    needs: [check-changes, test]
    if: needs.check-changes.outputs.docs-only != 'true'

    strategy:
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  # For docs-only changes, provide passing security check
  security-pass:
    name: Security Audit
    needs: check-changes
    if: needs.check-changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip security audit (docs-only change)
        run: echo "Skipping security audit - documentation-only changes detected"

  security:
    name: Security Audit
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'

      - name: Run npm audit
        # audit-level=critical: 72 known high/moderate vulnerabilities from transitive
        # dependencies (minimatch, ajv, tar, qs, next) tracked in BACKLOG-723.
        # None are critical. Will lower to --audit-level=high once dependencies are updated.
        # BACKLOG-2265: npm is retiring the audits/quick endpoint (400 "endpoint is being
        # retired"), which was hard-failing this required check repo-wide. Tolerate ONLY that
        # class of registry/endpoint infra error; a real critical vulnerability still fails.
        run: |
          set +e
          OUT=$(npm audit --audit-level=critical 2>&1); CODE=$?
          echo "$OUT"
          if echo "$OUT" | grep -qiE "endpoint is being retired|Invalid package tree|400 Bad Request|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up"; then
            echo "::warning::npm audit hit a registry/endpoint infra error (BACKLOG-2265) — treating as non-fatal. Real critical vulnerabilities still fail this step."
            exit 0
          fi
          exit $CODE

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true

  # Package on main (production) and develop (staging) branches
  package:
    name: Package Application
    runs-on: ${{ matrix.os }}
    needs: [check-changes, test, build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.check-changes.outputs.docs-only != 'true'

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: |
          echo "::group::Package Configuration"
          echo "Checking code signing configuration..."
          if [ -n "$MACOS_CERT" ]; then
            echo "✓ Code signing certificate: configured"
            echo "✓ Certificate password: $([ -n "$MACOS_CERT_PASSWORD" ] && echo 'configured' || echo 'not set')"
            echo "✓ Apple ID: $([ -n "$APPLE_ID" ] && echo 'configured' || echo 'not set')"
            echo "✓ Apple Team ID: $([ -n "$APPLE_TEAM_ID" ] && echo 'configured' || echo 'not set')"
            echo "::endgroup::"
            echo ""
            echo "Building signed package..."
            export CSC_LINK="$MACOS_CERT"
            export CSC_KEY_PASSWORD="$MACOS_CERT_PASSWORD"
            if ! npm run package 2>&1 | tee package.log; then
              echo "::error::Package build failed. Check package.log for details."
              cat package.log
              exit 1
            fi
          else
            echo "✗ Code signing certificate: not configured"
            echo "::warning::Building unsigned package - code signing secrets not configured"
            echo "::endgroup::"
            echo ""
            echo "Building unsigned package..."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if ! npm run package:unsigned 2>&1 | tee package.log; then
              echo "::error::Unsigned package build failed. Check package.log for details."
              cat package.log
              exit 1
            fi
          fi
          echo ""
          echo "::group::Build Artifacts"
          ls -la dist/*.dmg dist/*.zip 2>/dev/null || echo "No package artifacts found"
          echo "::endgroup::"
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Download and extract Apple drivers (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Downloading iTunes installer to extract Apple Mobile Device Support..."

          # Download iTunes installer
          $iTunesUrl = "https://www.apple.com/itunes/download/win64"
          $installerPath = "$env:TEMP\iTunes64Setup.exe"
          $extractPath = "$env:TEMP\iTunes-extracted"
          $targetPath = "resources\win\apple-drivers"

          echo "Downloading from $iTunesUrl..."
          Invoke-WebRequest -Uri $iTunesUrl -OutFile $installerPath -UseBasicParsing

          echo "Download complete. Size: $((Get-Item $installerPath).Length / 1MB) MB"

          # Extract using 7-Zip (pre-installed on GitHub runners)
          echo "Extracting with 7-Zip..."
          7z x $installerPath -o"$extractPath" -y

          # Find the MSI
          echo "Looking for AppleMobileDeviceSupport MSI..."
          $msi = Get-ChildItem -Path $extractPath -Recurse -Filter "AppleMobileDeviceSupport*.msi" | Select-Object -First 1

          if ($msi) {
            echo "Found: $($msi.FullName)"

            # Ensure target directory exists
            New-Item -ItemType Directory -Force -Path $targetPath | Out-Null

            # Copy MSI to resources
            Copy-Item $msi.FullName -Destination "$targetPath\AppleMobileDeviceSupport64.msi"

            # Create version file
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($msi.FullName).FileVersion
            if (-not $version) { $version = "unknown" }
            Set-Content -Path "$targetPath\version.txt" -Value $version

            echo "Apple drivers extracted successfully!"
            echo "MSI: $targetPath\AppleMobileDeviceSupport64.msi"
            echo "Version: $version"
          } else {
            echo "::warning::Could not find AppleMobileDeviceSupport MSI in extracted files"
            echo "Extracted contents:"
            Get-ChildItem -Path $extractPath -Recurse | Select-Object FullName
          }

          # Cleanup
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "Building Windows package..."
          npm run package:unsigned
          echo "Build complete. Checking artifacts..."
          Get-ChildItem -Path dist -Filter "*.exe" | Format-Table Name, Length
        shell: pwsh

      - name: Upload macOS package artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Upload Windows package artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.exe
          retention-days: 30

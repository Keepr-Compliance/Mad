name: CI/CD

# Branching Strategy:
# - main: Production-ready code, triggers packaging/releases
# - develop: Integration branch for next release
# - feature/*, fix/*, claude/*: Feature branches
#
# Merge Policy: Always use traditional merges (not squash) to retain commit history

on:
  push:
    # The two negations keep int-portal/ and hotfix-portal/ pushes at no push
    # run; they must stay AFTER '*-portal/**' (BACKLOG-3205).
    # 'int/**' pushes (a PR merged into an integration branch) run CI on both
    # macOS and Windows (BACKLOG-3177); int-portal/** stays excluded.
    branches: [main, develop, 'int/**', 'feature/**', 'fix/**', 'claude/**', 'docs/**', 'portal/**', '*-portal/**', '!int-portal/**', '!hotfix-portal/**']
  pull_request:
    branches: [main, develop, 'int/**', 'int-portal/**']

jobs:
  # Fast check to determine if we can skip heavy CI jobs
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      os-matrix: ${{ steps.os.outputs.os-matrix }}
      android-changed: ${{ steps.android.outputs.android-changed }}
      broker-portal-changed: ${{ steps.portals.outputs.broker-portal-changed }}
      admin-portal-changed: ${{ steps.portals.outputs.admin-portal-changed }}
      harness-tests-changed: ${{ steps.harness.outputs.harness-tests-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Fetch all history for proper branch comparison

      - name: Fetch base branch for PR comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      # BACKLOG-2729: the changed-file list is computed ONCE here; the three
      # filter steps below read it from $RUNNER_TEMP/changed-files.txt.
      # - pull_request: the base ref's merge base (three-dot), as before.
      # - push of a merge commit: from merge-base(HEAD^1, HEAD^2) to HEAD, so
      #   BOTH sides count. HEAD~1..HEAD sees only what the second parent
      #   brought in, which is empty when a base branch is merged into a branch.
      #   github.event.before..HEAD is the same first-parent diff on a
      #   one-commit push, and 0000000 on a new branch, so it is not used.
      # - push of a single-parent commit: HEAD~1..HEAD, as before.
      # fetch-depth: 0 above keeps both parents and their merge base reachable.
      - name: Compute changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          OUT="$RUNNER_TEMP/changed-files.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Diff basis: origin/$BASE_REF...HEAD (pull_request)"
            git diff --name-only "origin/$BASE_REF...HEAD" > "$OUT"
          elif git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            MERGE_BASE=$(git merge-base 'HEAD^1' 'HEAD^2')
            echo "Diff basis: $MERGE_BASE..HEAD (push, merge commit: merge-base of HEAD^1 and HEAD^2)"
            git diff --name-only "$MERGE_BASE" HEAD > "$OUT"
          else
            echo "Diff basis: HEAD~1..HEAD (push, single-parent commit)"
            git diff --name-only HEAD~1 HEAD > "$OUT" 2>/dev/null || git diff --name-only HEAD > "$OUT"
          fi
          echo "Changed files: $(grep -c . "$OUT" || true)"

      - name: Check for docs-only changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Changed files (computed once by the "Compute changed files" step)
          CHANGED=$(cat "$RUNNER_TEMP/changed-files.txt")

          echo "Changed files:"
          echo "$CHANGED"

          # Check if all changes are docs/markdown only
          DOCS_ONLY="true"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                *.md|.claude/*|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE/*|.github/workflows/*|LICENSE|*.txt)
                  # Documentation or config file, continue
                  ;;
                *)
                  # Non-docs file found
                  DOCS_ONLY="false"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          # BACKLOG-2729: on push, an EMPTY list is not evidence of a docs-only
          # change; run the full suite rather than pass it via docs-pass.
          if [ "$EVENT_NAME" != "pull_request" ] && [ -z "$CHANGED" ]; then
            DOCS_ONLY="false"
            echo "Empty changed-file list on push: docs-only=false"
          fi

          # BACKLOG-2729: pushes to main, develop and int/* never take the
          # docs-only shortcut; the full matrix runs whatever the list holds.
          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              main|develop|int/*)
                DOCS_ONLY="false"
                echo "Push to $REF_NAME: docs-only=false (full run on this branch)"
                ;;
            esac
          fi

          echo "docs-only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          echo "Result: docs-only=$DOCS_ONLY"

      - name: Check for android-companion changes
        id: android
        run: |
          # Same list as the docs-only filter above ("Compute changed files")
          CHANGED=$(cat "$RUNNER_TEMP/changed-files.txt")

          # true if ANY changed file lives under android-companion/
          ANDROID_CHANGED="false"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                android-companion/*)
                  ANDROID_CHANGED="true"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "android-changed=$ANDROID_CHANGED" >> $GITHUB_OUTPUT
          echo "Result: android-changed=$ANDROID_CHANGED"

      # BACKLOG-3099: which portal(s) the change touches, so the two portal lint
      # jobs below run only when they can say something. ONE step sets BOTH
      # flags: two steps would be two more full diffs of the same range, and two
      # copies of a filter are two chances for them to disagree.
      - name: Check for portal changes
        id: portals
        run: |
          # Same list as the filters above ("Compute changed files")
          CHANGED=$(cat "$RUNNER_TEMP/changed-files.txt")

          BROKER_CHANGED="false"
          ADMIN_CHANGED="false"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                broker-portal/*)
                  BROKER_CHANGED="true"
                  ;;
                # BACKLOG-4090: admin-portal also compiles packages/ui, shared and
                # design-system, and a lockfile change can move its types.
                admin-portal/*|packages/ui/*|packages/shared/*|packages/design-system/*|package-lock.json)
                  ADMIN_CHANGED="true"
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "broker-portal-changed=$BROKER_CHANGED" >> $GITHUB_OUTPUT
          echo "admin-portal-changed=$ADMIN_CHANGED" >> $GITHUB_OUTPUT
          echo "Result: broker-portal-changed=$BROKER_CHANGED admin-portal-changed=$ADMIN_CHANGED"

      # BACKLOG-4263: the harness python gates below run only when a test folder,
      # the migration pins or this workflow changed. Same list as the filters above.
      - name: Check for harness test changes
        id: harness
        run: |
          CHANGED=$(cat "$RUNNER_TEMP/changed-files.txt")

          HARNESS_CHANGED="false"
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              case "$file" in
                supabase/tests/*|supabase/migrations/*|broker-portal/__tests__/migrations/*|.github/workflows/ci.yml)
                  HARNESS_CHANGED="true"
                  break
                  ;;
              esac
            fi
          done <<< "$CHANGED"

          echo "harness-tests-changed=$HARNESS_CHANGED" >> $GITHUB_OUTPUT
          echo "Result: harness-tests-changed=$HARNESS_CHANGED"

      - name: Determine OS matrix
        id: os
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # PRs (to develop/main/int/*/int-portal/*) and pushes to develop/main/int/*: run both macOS + Windows
          # Pushes to feature/fix/claude branches: macOS only (Windows runs on the PR)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'os-matrix=["macos-latest","windows-latest"]' >> $GITHUB_OUTPUT
            echo "OS: both (pull_request)"
          elif [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "develop" || "$GITHUB_REF_NAME" == int/* ]]; then
            echo 'os-matrix=["macos-latest","windows-latest"]' >> $GITHUB_OUTPUT
            echo "OS: both (push to $GITHUB_REF_NAME)"
          else
            echo 'os-matrix=["macos-latest"]' >> $GITHUB_OUTPUT
            echo "OS: macOS only (push to feature branch)"
          fi

  # For docs-only changes, provide passing status checks without running heavy tests
  # Matrix must match the real test job to produce identical status check names
  docs-pass:
    name: Test & Lint (${{ matrix.os }})
    needs: check-changes
    if: needs.check-changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}
        node-version: [22.23.4]
    steps:
      - name: Skip tests (docs-only change)
        run: echo "Skipping tests for ${{ matrix.os }} / Node ${{ matrix.node-version }} - documentation-only changes detected"

  # BACKLOG-4125: the desktop suite runs as parallel jobs per OS instead of one
  # long "Test & Lint" job. Per OS:
  #   checks-<os>   install, native rebuild for Electron + asserts, type-check,
  #                 type-check:tests, lint, and the listed suite total
  #   jest-<os>     the root jest suite in 4 shards (--shard=i/4), 2 workers each
  #   portal-<os>   integration tier, broker-portal jest, admin-portal vitest
  #   test-<os>     the aggregator. Its check name is the required context
  #                 "Test & Lint (<os>)" on develop and main.
  #
  # The jobs are defined once per OS (not one OS x shard matrix) so each
  # aggregator reads its own OS's results through needs.<job>.result.
  #
  # Exactly one of docs-pass / test-<os> reports each required name:
  #   - docs-only == 'true'  -> docs-pass runs; test-<os> is skipped.
  #   - docs-only != 'true'  -> test-<os> runs for each OS in os-matrix;
  #                             docs-pass is skipped.
  #   - check-changes failed -> docs-pass is skipped; test-<os> runs and fails.
  # A SKIPPED matrix job is listed under its unexpanded name
  # "Test & Lint (${{ matrix.os }})", never under a required name; that is why
  # docs-pass and each aggregator carry a matrix (the aggregator's has one entry).
  #
  # The shards call jest directly after `npm rebuild` of the native module for
  # Node. They do not go through `npm test` (scripts/test-with-restore.js),
  # whose restore to the Electron build takes ~45 s and is needed by nothing
  # after jest in CI. `npm test` on a developer machine is unchanged.

  checks-macos:
    name: Checks (macos-latest)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true' && contains(needs.check-changes.outputs.os-matrix, 'macos-latest')
    # BACKLOG-3198: the macOS runner is the pinned label in .github/macos-runner.json.
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      suite-total: ${{ steps.listed.outputs.suite-total }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      # BACKLOG-3198: warn (not fail) when the OS inside the pinned label moved.
      - name: Report macOS runner drift
        run: node scripts/ci/check-macos-runner.mjs --host --warn

      - name: Check Node.js version (BACKLOG-4053)
        shell: bash
        run: |
          node scripts/ci/check-node-version.mjs "$(node -v)"
          node scripts/__tests__/check-node-version.verify.js
          node scripts/__tests__/ensure-electron-dist.verify.js

      # BACKLOG-4125: the shard and aggregator guards, driven red on purpose.
      - name: Verify the jest shard guard
        run: node scripts/__tests__/jest-shard-guard.verify.js

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      # BACKLOG-4052 (R-6): ignore-scripts skips Electron's own install script,
      # so the binary is absent unless fetched here. The checks below need it.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules for Electron
        run: node scripts/rebuild-native.js
        continue-on-error: true

      # BACKLOG-4052 (R-6): the step above may fail without failing the job;
      # this asserts what it was for: the module loads under this Electron.
      - name: Assert native module loads under Electron
        run: node scripts/ci/check-native-under-electron.js

      # BACKLOG-4052: the CA denylist, run under this Electron's own Node.
      - name: Check Node CA denylist under Electron
        run: node scripts/ci/check-node-ca-denylist.js

      # BACKLOG-4052 (R-7): permanent. Skip prebuild-install and build with the
      # electron-rebuild fallback (@electron/rebuild), so a broken fallback shows
      # up here and not on the day a prebuild is missing.
      - name: Rebuild native modules from source (forced fallback)
        run: node scripts/rebuild-native.js
        env:
          KEEPR_REBUILD_FROM_SOURCE: '1'

      - name: Assert native module loads under Electron (from-source build)
        run: node scripts/ci/check-native-under-electron.js

      # BACKLOG-2505: an explicit, identical old-space limit on every Node step;
      # type-check:tests needs ~2 GB and OOM'd on the runner-derived limit.
      - name: TypeScript type check
        run: npm run type-check
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-2414: tsconfig.json excludes **/*.test.*; this checks the test
      # suite. BACKLOG-2505: print the limit actually in force before running.
      - name: TypeScript type check (test suite)
        run: |
          node -p "'v8 heap_size_limit: ' + Math.round(require('v8').getHeapStatistics().heap_size_limit / 1048576) + ' MB'"
          npm run type-check:tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run linter
        run: npm run lint
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-4125: the number of suites the shards must add up to. CI=true is
      # set by Actions; the root config selects the CI testMatch from it.
      - name: Count the listed jest suites
        id: listed
        shell: bash
        run: |
          npx jest --listTests --json > "$RUNNER_TEMP/jest-list.json"
          node scripts/ci/jest-shard-guard.mjs expected --list "$RUNNER_TEMP/jest-list.json"

  jest-macos:
    name: Jest shard ${{ matrix.shard }}/4 (macos-latest)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true' && contains(needs.check-changes.outputs.os-matrix, 'macos-latest')
    runs-on: macos-26
    # The unsharded suite took 17-30 min on 2 workers; one shard is about a
    # quarter of that. 25 min makes a hang visible well before the old 60.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      # BACKLOG-4052 (R-6): ignore-scripts skips Electron's own install script,
      # so the binary is absent unless fetched here.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # The real-module suites load two native modules under Node:
      # - sqlite3 is Node-API (one binary for Node and Electron). The Checks job
      #   gets it from scripts/rebuild-native.js; here its own install script
      #   (prebuild-install -r napi || node-gyp rebuild) builds it.
      # - better-sqlite3-multiple-ciphers built for Node: the same `npm rebuild`
      #   that scripts/test-with-restore.js runs before jest (its "flip"). No
      #   restore follows; nothing after jest in CI needs the Electron build.
      - name: Rebuild native modules for Node (jest)
        run: npm rebuild sqlite3 better-sqlite3-multiple-ciphers

      - name: Assert native modules load under Node
        run: node -e "new (require('better-sqlite3-multiple-ciphers'))(':memory:').close(); new (require('sqlite3').Database)(':memory:').close(); console.log('native modules load under Node ' + process.version)"

      # BACKLOG-3288: --bail=0 reports EVERY failing suite (needs "=": "--bail 0"
      # is bail 1 plus a test filter "0"). Never add --passWithNoTests: a shard
      # that matches nothing must fail (jest exits 1), and the guard below
      # fails it again on a zero count.
      - name: Run tests
        shell: bash
        run: npx jest --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB --forceExit --bail=0 --shard=${{ matrix.shard }}/4 --json --outputFile="$RUNNER_TEMP/jest-shard.json"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Fails when the JSON is missing (a throwing net-guard globalTeardown
      # suppresses it) or reports 0 suites or 0 tests. Runs after a red jest
      # step too, so the counts are always printed.
      - name: Check shard result
        if: success() || failure()
        shell: bash
        run: node scripts/ci/jest-shard-guard.mjs shard --json "$RUNNER_TEMP/jest-shard.json" --shard ${{ matrix.shard }}/4 --out "$RUNNER_TEMP/jest-summary/macos-latest-shard-${{ matrix.shard }}.json"; grep -o 'C-5d cascade deletes mark the deal[^"]*' "$RUNNER_TEMP/jest-shard.json" || true

      - name: Upload shard summary
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-summary-macos-latest-${{ matrix.shard }}
          path: ${{ runner.temp }}/jest-summary/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  portal-macos:
    name: Integration & Portal Tests (macos-latest)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true' && contains(needs.check-changes.outputs.os-matrix, 'macos-latest')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      # BACKLOG-4052 (R-6): ignore-scripts skips Electron's own install script,
      # so the binary is absent unless fetched here.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # The real-module suites load two native modules under Node:
      # - sqlite3 is Node-API (one binary for Node and Electron). The Checks job
      #   gets it from scripts/rebuild-native.js; here its own install script
      #   (prebuild-install -r napi || node-gyp rebuild) builds it.
      # - better-sqlite3-multiple-ciphers built for Node: the same `npm rebuild`
      #   that scripts/test-with-restore.js runs before jest (its "flip"). No
      #   restore follows; nothing after jest in CI needs the Electron build.
      - name: Rebuild native modules for Node (jest)
        run: npm rebuild sqlite3 better-sqlite3-multiple-ciphers

      - name: Assert native modules load under Node
        run: node -e "new (require('better-sqlite3-multiple-ciphers'))(':memory:').close(); new (require('sqlite3').Database)(':memory:').close(); console.log('native modules load under Node ' + process.version)"

      # BACKLOG-1786: integration tier (sync -> classification -> detection),
      # its own config. No --forceExit: this tier leaks no open handles.
      - name: Run integration test tier
        run: npm run test:integration -- --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-2005a / BACKLOG-3288: runs from the repo root so ts-jest and the
      # jest environments resolve from the hoisted node_modules; --bail=0 (with
      # "=") reports every failing suite.
      - name: Run broker-portal tests
        run: npx jest --config broker-portal/jest.config.js --silent --bail=0
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run admin-portal tests
        working-directory: admin-portal
        run: npx vitest run
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # The required check "Test & Lint (macos-latest)". always(): without it a failed
  # or cancelled shard SKIPS this job, and a skipped required job reports
  # success. It fails unless every needed job succeeded and the shards' suite
  # total equals the Checks job's `jest --listTests` count.
  test-macos:
    name: Test & Lint (${{ matrix.os }})
    needs: [check-changes, checks-macos, jest-macos, portal-macos]
    if: always() && needs.check-changes.outputs.docs-only != 'true' && (needs.check-changes.result != 'success' || contains(needs.check-changes.outputs.os-matrix, 'macos-latest'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Require every needed job to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/jest-shard-guard.mjs results --require check-changes,checks-macos,jest-macos,portal-macos

      - name: Download shard summaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jest-summary-macos-latest-*
          path: ${{ runner.temp }}/jest-summary
          merge-multiple: true

      - name: Check the shards ran every listed suite
        env:
          EXPECTED: ${{ needs.checks-macos.outputs.suite-total }}
        run: node scripts/ci/jest-shard-guard.mjs aggregate --dir "$RUNNER_TEMP/jest-summary" --shards 4 --expected "$EXPECTED"

  checks-windows:
    name: Checks (windows-latest)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true' && contains(needs.check-changes.outputs.os-matrix, 'windows-latest')
    # BACKLOG-3198: the macOS runner is the pinned label in .github/macos-runner.json.
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      suite-total: ${{ steps.listed.outputs.suite-total }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Check Node.js version (BACKLOG-4053)
        shell: bash
        run: |
          node scripts/ci/check-node-version.mjs "$(node -v)"
          node scripts/__tests__/check-node-version.verify.js
          node scripts/__tests__/ensure-electron-dist.verify.js

      # BACKLOG-4125: the shard and aggregator guards, driven red on purpose.
      - name: Verify the jest shard guard
        run: node scripts/__tests__/jest-shard-guard.verify.js

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      # BACKLOG-4052 (R-6): ignore-scripts skips Electron's own install script,
      # so the binary is absent unless fetched here. The checks below need it.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules for Electron
        run: node scripts/rebuild-native.js
        continue-on-error: true

      # BACKLOG-4052 (R-6): the step above may fail without failing the job;
      # this asserts what it was for: the module loads under this Electron.
      - name: Assert native module loads under Electron
        run: node scripts/ci/check-native-under-electron.js

      # BACKLOG-4052: the CA denylist, run under this Electron's own Node.
      - name: Check Node CA denylist under Electron
        run: node scripts/ci/check-node-ca-denylist.js

      # BACKLOG-4052 (R-7): permanent. Skip prebuild-install and build with the
      # electron-rebuild fallback (@electron/rebuild), so a broken fallback shows
      # up here and not on the day a prebuild is missing.
      - name: Rebuild native modules from source (forced fallback)
        run: node scripts/rebuild-native.js
        env:
          KEEPR_REBUILD_FROM_SOURCE: '1'

      - name: Assert native module loads under Electron (from-source build)
        run: node scripts/ci/check-native-under-electron.js

      # BACKLOG-2505: an explicit, identical old-space limit on every Node step;
      # type-check:tests needs ~2 GB and OOM'd on the runner-derived limit.
      - name: TypeScript type check
        run: npm run type-check
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-2414: tsconfig.json excludes **/*.test.*; this checks the test
      # suite. BACKLOG-2505: print the limit actually in force before running.
      - name: TypeScript type check (test suite)
        run: |
          node -p "'v8 heap_size_limit: ' + Math.round(require('v8').getHeapStatistics().heap_size_limit / 1048576) + ' MB'"
          npm run type-check:tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run linter
        run: npm run lint
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-4125: the number of suites the shards must add up to. CI=true is
      # set by Actions; the root config selects the CI testMatch from it.
      - name: Count the listed jest suites
        id: listed
        shell: bash
        run: |
          npx jest --listTests --json > "$RUNNER_TEMP/jest-list.json"
          node scripts/ci/jest-shard-guard.mjs expected --list "$RUNNER_TEMP/jest-list.json"

  jest-windows:
    name: Jest shard ${{ matrix.shard }}/4 (windows-latest)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true' && contains(needs.check-changes.outputs.os-matrix, 'windows-latest')
    runs-on: windows-latest
    # The unsharded suite took 17-30 min on 2 workers; one shard is about a
    # quarter of that. 25 min makes a hang visible well before the old 60.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      # BACKLOG-4052 (R-6): ignore-scripts skips Electron's own install script,
      # so the binary is absent unless fetched here.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # The real-module suites load two native modules under Node:
      # - sqlite3 is Node-API (one binary for Node and Electron). The Checks job
      #   gets it from scripts/rebuild-native.js; here its own install script
      #   (prebuild-install -r napi || node-gyp rebuild) builds it.
      # - better-sqlite3-multiple-ciphers built for Node: the same `npm rebuild`
      #   that scripts/test-with-restore.js runs before jest (its "flip"). No
      #   restore follows; nothing after jest in CI needs the Electron build.
      - name: Rebuild native modules for Node (jest)
        run: npm rebuild sqlite3 better-sqlite3-multiple-ciphers

      - name: Assert native modules load under Node
        run: node -e "new (require('better-sqlite3-multiple-ciphers'))(':memory:').close(); new (require('sqlite3').Database)(':memory:').close(); console.log('native modules load under Node ' + process.version)"

      # BACKLOG-3288: --bail=0 reports EVERY failing suite (needs "=": "--bail 0"
      # is bail 1 plus a test filter "0"). Never add --passWithNoTests: a shard
      # that matches nothing must fail (jest exits 1), and the guard below
      # fails it again on a zero count.
      - name: Run tests
        shell: bash
        run: npx jest --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB --forceExit --bail=0 --shard=${{ matrix.shard }}/4 --json --outputFile="$RUNNER_TEMP/jest-shard.json"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Fails when the JSON is missing (a throwing net-guard globalTeardown
      # suppresses it) or reports 0 suites or 0 tests. Runs after a red jest
      # step too, so the counts are always printed.
      - name: Check shard result
        if: success() || failure()
        shell: bash
        run: node scripts/ci/jest-shard-guard.mjs shard --json "$RUNNER_TEMP/jest-shard.json" --shard ${{ matrix.shard }}/4 --out "$RUNNER_TEMP/jest-summary/windows-latest-shard-${{ matrix.shard }}.json"

      - name: Upload shard summary
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-summary-windows-latest-${{ matrix.shard }}
          path: ${{ runner.temp }}/jest-summary/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  portal-windows:
    name: Integration & Portal Tests (windows-latest)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true' && contains(needs.check-changes.outputs.os-matrix, 'windows-latest')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build preload
        run: npm run build:preload

      # BACKLOG-4052 (R-6): ignore-scripts skips Electron's own install script,
      # so the binary is absent unless fetched here.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # The real-module suites load two native modules under Node:
      # - sqlite3 is Node-API (one binary for Node and Electron). The Checks job
      #   gets it from scripts/rebuild-native.js; here its own install script
      #   (prebuild-install -r napi || node-gyp rebuild) builds it.
      # - better-sqlite3-multiple-ciphers built for Node: the same `npm rebuild`
      #   that scripts/test-with-restore.js runs before jest (its "flip"). No
      #   restore follows; nothing after jest in CI needs the Electron build.
      - name: Rebuild native modules for Node (jest)
        run: npm rebuild sqlite3 better-sqlite3-multiple-ciphers

      - name: Assert native modules load under Node
        run: node -e "new (require('better-sqlite3-multiple-ciphers'))(':memory:').close(); new (require('sqlite3').Database)(':memory:').close(); console.log('native modules load under Node ' + process.version)"

      # BACKLOG-1786: integration tier (sync -> classification -> detection),
      # its own config. No --forceExit: this tier leaks no open handles.
      - name: Run integration test tier
        run: npm run test:integration -- --silent --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # BACKLOG-2005a / BACKLOG-3288: runs from the repo root so ts-jest and the
      # jest environments resolve from the hoisted node_modules; --bail=0 (with
      # "=") reports every failing suite.
      - name: Run broker-portal tests
        run: npx jest --config broker-portal/jest.config.js --silent --bail=0
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run admin-portal tests
        working-directory: admin-portal
        run: npx vitest run
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # The required check "Test & Lint (windows-latest)". always(): without it a failed
  # or cancelled shard SKIPS this job, and a skipped required job reports
  # success. It fails unless every needed job succeeded and the shards' suite
  # total equals the Checks job's `jest --listTests` count.
  test-windows:
    name: Test & Lint (${{ matrix.os }})
    needs: [check-changes, checks-windows, jest-windows, portal-windows]
    if: always() && needs.check-changes.outputs.docs-only != 'true' && (needs.check-changes.result != 'success' || contains(needs.check-changes.outputs.os-matrix, 'windows-latest'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Require every needed job to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/jest-shard-guard.mjs results --require check-changes,checks-windows,jest-windows,portal-windows

      - name: Download shard summaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jest-summary-windows-latest-*
          path: ${{ runner.temp }}/jest-summary
          merge-multiple: true

      - name: Check the shards ran every listed suite
        env:
          EXPECTED: ${{ needs.checks-windows.outputs.suite-total }}
        run: node scripts/ci/jest-shard-guard.mjs aggregate --dir "$RUNNER_TEMP/jest-summary" --shards 4 --expected "$EXPECTED"

  # BACKLOG-2485: block personal-looking data from entering source/test paths.
  # This repository is public, so a fixture containing a real person's address or
  # phone number is permanently republished to every clone and fork the moment it
  # lands. Deliberately NOT gated on docs-only: the check is a few seconds of pure
  # node with no install step, and it must always report a status.
  fixture-pii:
    name: Fixture PII Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # BACKLOG-2871: the bare-uuid rule reads the ADDED LINES of the commits
          # under review, so this job needs history. The default depth-1 checkout
          # has no base commit to diff against and the rule would silently check
          # nothing.
          fetch-depth: 0

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      # The tree rules (email / phone / name) always run. The bare-uuid rule needs
      # a commit range, which is derived here.
      #
      # THIS JOB IS ALLOWED TO DEGRADE; THE PRE-PUSH HOOK IS NOT. On a PUBLIC repo
      # CI runs after the object already exists on GitHub, so this job is a
      # notification and the hook is the gate. When no range can be derived, this
      # says so loudly and still runs the tree scan, rather than failing a build
      # for a reason unrelated to the diff. `.husky/pre-push` fails CLOSED on the
      # same condition, on purpose.
      - name: Derive the commit range under review
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -u
          range=""
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            range="$PR_HEAD --not $PR_BASE"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$(echo "$PUSH_BEFORE" | tr -d '0')" != "" ]; then
            # A non-zero `before` means this push had a predecessor on the branch.
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$GITHUB_SHA --not $PUSH_BEFORE"
            fi
          fi
          if [ -z "$range" ]; then
            echo "::warning title=Fixture PII Scan::No commit range could be derived (new branch, force-push, or first push). The bare-uuid rule checked NOTHING on this run; the tree rules still ran. The pre-push hook is the gate for this rule."
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan fixtures for personal data
        env:
          PII_RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -u
          if [ -n "${PII_RANGE:-}" ]; then
            node scripts/ci/check-fixture-pii.mjs --diff-range "$PII_RANGE"
          else
            npm run check:pii
          fi

      # BACKLOG-2871: the guard's own verification harness. It existed since
      # BACKLOG-2657 and NOTHING RAN IT -- not CI, not package.json, not the hook.
      # A verification harness that never executes is indistinguishable from one
      # that passes, which is the exact failure this repo keeps filing.
      - name: Verify the guard itself
        run: npm run verify:pii

  # BACKLOG-2678: fail the build when a tracked test file is run by NO CI test config.
  #
  # jest.config.js used different testMatch lists under CI and locally, so a file matched only by
  # the local list ran on developer machines and in the pre-push hook and NEVER in CI — 47 of 622
  # tracked test files, 31 of them the QA harness's own suites, with nothing able to report it.
  # Converging the globs closed that day's gap; this job is what stops it reopening.
  #
  # Deliberately NOT gated on docs-only, and deliberately WITHOUT `needs: check-changes`: the
  # docs-only filter treats `.github/workflows/*` as documentation, so a workflow-only PR would
  # skip this job — which is precisely how a gate gets disabled without anyone noticing
  # (cf. BACKLOG-2506: duplicated job names and a push leg that emitted no Windows job, all merged
  # green). It must always run and always report a status.
  #
  # Unique job name + unique status-check name. Do NOT add a second job with this name.
  test-drift:
    name: Test Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      # The gate asks each runner to list its own tests rather than reimplementing glob matching,
      # so jest/vitest must be installed. ignore-scripts skips the electron/native rebuild — test
      # DISCOVERY needs no native module and no app build.
      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      # android-companion is NOT an npm workspace (own package-lock, jest-expo preset), so the root
      # install does not provide its node_modules. Without this, its probe reports DEAD and its 30
      # test files look orphaned.
      - name: Install android-companion dependencies
        working-directory: android-companion
        run: npm ci
        env:
          npm_config_ignore_scripts: true

      - name: Check for orphaned test files
        run: node scripts/ci/check-test-drift.mjs

  # BACKLOG-2577: hook infrastructure requires branch-independence, and tracking
  # is definitionally branch-dependence. Committing anything under .husky/_ makes
  # the runner directory disappear on a checkout of any branch without it, which
  # silently disables pre-push and pre-commit repo-wide (exit 0, no warning).
  # This job is the standing rule preventing that packaging from returning.
  # No npm install: the check reads the git index only, and husky's installer
  # would write core.hooksPath as a side effect if it ran in CI.
  hooks-tracking:
    name: Hooks Tracking Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Assert nothing under .husky/_ is tracked
        run: npm run check:hooks

  # BACKLOG-3425: `build.files` must never reach electron-builder's own output directory.
  # It did for at least three releases -- `files` listed `dist/**` and `dist` was also the
  # default output -- and the second architecture's pass packed the first one's artifacts,
  # producing an Intel build that could not start.
  #
  # Deliberately NOT gated on docs-only and carrying no `needs:`, for the same reason the
  # SQL-boundary gate below is not: the docs-only filter treats .github/workflows/* as
  # documentation, and the `package` job only runs on develop and main, so a package.json
  # edit on a feature branch would otherwise reach develop with nothing having read it.
  #
  # No npm install: the check parses package.json and nothing else.
  package-config:
    name: Package Config Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Assert the packager cannot pack its own output
        run: node scripts/ci/check-package-sanity.mjs --config package.json

      # BACKLOG-3198: every macOS job runs on the pinned label.
      - name: Assert macOS runners use the pinned label
        run: node scripts/ci/check-macos-runner.mjs --workflows

      # BACKLOG-4245: the stable, beta and rehearsal publish paths in release.yml
      # stay as reviewed.
      - name: Assert the release feed publish paths
        run: node scripts/ci/check-release-feed-flags.mjs

  # BACKLOG-3814. The iPhone tools in resources/win/libimobiledevice are the signed
  # copies from the 2.40.0 installer, shipped byte-for-byte every release. This job
  # needs no secrets: it checks the folder against
  # resources/pinned/libimobiledevice.manifest.json (no mismatch, missing or extra
  # file), then asks Windows itself whether each signature is still Valid and carries
  # a timestamp. The signing certificate is short-lived; the RFC3161 timestamp is what
  # keeps these files Valid after it expires, so a lost timestamp is a release blocker.
  # Not gated on docs-only and no `needs:`, for the same reason as package-config.
  pinned-iphone-tools:
    name: Pinned iPhone Tools
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Verify the pinned iPhone tools match the manifest
        run: node scripts/release/pinnedIphoneTools.js --repo

      - name: Verify every pinned file has a Valid, timestamped signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $m = Get-Content -Raw resources/pinned/libimobiledevice.manifest.json | ConvertFrom-Json
          $names = @($m.files.PSObject.Properties.Name)
          if ($names.Count -lt 1) { Write-Error "manifest lists no files"; exit 1 }
          $bad = 0
          foreach ($n in $names) {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $m.dir $n)
            $signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "" }
            $tsa = if ($sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { "" }
            echo ("{0,-10} {1,-32} | {2} | TSA: {3}" -f $sig.Status, $n, $signer, $tsa)
            if ($sig.Status -ne "Valid" -or -not $sig.TimeStamperCertificate -or $signer -notmatch "Blue Spaces LLC") { $bad++ }
          }
          if ($bad -gt 0) { echo "::error::$bad pinned iPhone tool file(s) are not Valid, not timestamped, or not signed by Blue Spaces LLC"; exit 1 }
          echo "OK: $($names.Count) pinned files Valid and timestamped."

  # BACKLOG-2959: SQL text belongs in electron/services/db/** (the *Sql.ts
  # pattern). This gate fails when a NEW site defines SQL text anywhere else.
  #
  # It matches .prepare(, .exec( AND .pragma(. A .prepare(-only gate is
  # decorative: it would pass a file holding raw db.exec() DDL, which is the
  # PR-SOP 6.2e failure this gate exists to end.
  #
  # Classification is an AST walk, not a grep: 41% of the tree's call sites put
  # argument 0 on a following line, where a line-oriented grep cannot see it.
  # It classifies argument 0's ORIGIN, not the receiver name, so RegExp.exec is
  # green without a name blacklist, and SQL hoisted into a local const is red.
  #
  # Deliberately NOT gated on docs-only and carrying no `needs:`. The docs-only
  # filter at the top of this file treats `.github/workflows/*` as
  # documentation, so a workflow-only PR skips every job that depends on
  # check-changes — which is precisely how a gate gets switched off without
  # anyone noticing (cf. the test-drift and text-sources jobs, same shape, same
  # reason). It must always run and always report a status.
  #
  # Unique job name + unique status-check name. Do NOT add a second job with
  # this name.
  sql-boundary:
    name: SQL Boundary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      # The gate parses TypeScript with the compiler API, so `typescript` must be
      # installed. ignore-scripts skips the electron/native rebuild: parsing needs
      # no native module and no app build.
      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Assert no SQL text is defined outside the db layer
        run: npm run check:sql-boundary

      # The guard's own verification harness. A harness that never executes is
      # indistinguishable from one that passes -- the failure this repo keeps
      # filing (cf. "Verify the guard itself" on the fixture-pii job).
      - name: Verify the guard itself
        run: npm run verify:sql-boundary

  # BACKLOG-2962: native capabilities (OS secret storage) live behind an
  # interface, so the core does not import Electron to reach them. Two rules:
  # `safeStorage` may only be value-imported inside the Electron implementation
  # directory, and modules declared portable may not value-import "electron" at
  # all. Both are AST rules -- a comment or a string mentioning safeStorage is
  # not a call, which is precisely the mistake that mis-measured this item's
  # scope three times before it was built.
  #
  # Unique job name + unique status-check name. Do NOT add a second job with
  # this name.
  native-capabilities:
    name: Native Capability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      # The gate parses TypeScript with the compiler API, so `typescript` must be
      # installed. ignore-scripts skips the electron/native rebuild: parsing needs
      # no native module and no app build.
      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Assert native capabilities are reached only through their interface
        run: npm run check:native-capabilities

      # A guard that has never been seen red proves nothing. This plants a
      # violation of every shape the gate claims to catch, and every shape it
      # claims to ignore.
      - name: Verify the guard itself
        run: npm run verify:native-capabilities

  # BACKLOG-2637: a source file holding a raw NUL is classified as binary by the
  # search tools, which then omit it from every repo-wide sweep WITHOUT warning
  # and WITHOUT a non-zero exit. The result is not a slow search or a failed one
  # — it is a clean-looking negative, and nothing anywhere says the file was
  # skipped. It happened twice in one epic and both times a person found it by
  # running `file` on a hunch, not by any check.
  #
  # Scope is repository-wide on purpose. The narrow first draft (electron/ and
  # src/) left 691 of 2,051 tracked .ts/.tsx unchecked — a third of the
  # TypeScript — and the clinching case is the guard script itself, which
  # acquired the defect during its own development and lives in scripts/.
  #
  # Detection is a strict read of every tracked TS/JS file, NOT `file(1)`: file
  # reads a prefix, and was measured calling a 200 KB file with a NUL at offset
  # 150,000 "ASCII text" while that file was silently unsearchable. The same pass
  # catches invalid UTF-8, which git cannot see and which ugrep — what `grep`
  # resolves to in the agent shell — also skips silently. 2,121 files in ~0.7s.
  #
  # Deliberately NOT gated on docs-only: no install step, and it must always
  # report a status.
  text-sources:
    name: Text Source Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      - name: Assert every tracked TS/JS file is searchable
        run: npm run check:text-sources

  # BACKLOG-1750: gate the @keepr/ui shared component library. Isolated,
  # platform-agnostic job (single OS, no native modules) — the root `test` job
  # excludes packages/ (see jest.config.js testPathIgnorePatterns), so without
  # this the library would have no CI regression protection. ignore-scripts skips
  # the electron/native postinstall the package doesn't need.
  packages-ui:
    name: UI Package (@keepr/ui)
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Type check (@keepr/ui)
        run: npm run type-check -w @keepr/ui

      - name: Lint (@keepr/ui)
        run: npm run lint -w @keepr/ui

      - name: Test (@keepr/ui)
        run: npm test -w @keepr/ui

  # BACKLOG-3099: lint broker-portal/. Until this job existed, NOTHING linted
  # either portal. `npm run lint` is `eslint electron src scripts .claude/scripts`;
  # the only lint step in this file (job `test`, "Run linter") runs exactly that
  # command, and the pre-push hook ran no lint at all. PR #2494 changed seven
  # broker-portal/ files and no linter read one of them, in either place.
  #
  # NOT a step in `Test & Lint`: that job is the macOS + Windows desktop suite and
  # BACKLOG-3093 exists to stop portal changes running it. Own job, single OS, no
  # native modules -- the packages-ui shape above. ignore-scripts skips the
  # electron/native postinstall a lint does not need.
  #
  # Gated on broker-portal-changed with the mirror-skip below, so a desktop-only
  # change does not pay for it while the status-check name is still always
  # reported (ready to be made a required check). Same idiom, same reason, as
  # android-companion / android-companion-skip below.
  #
  # ERRORS fail this job; WARNINGS do not -- no --max-warnings=0, which is what
  # `next lint` does on its own. Measured at 4be1c694f: broker-portal 0 errors /
  # 23 warnings, admin-portal 0 errors / 6 warnings (counted as `line:col Warning:`
  # findings -- `next lint` also prints one non-finding "inferred your workspace
  # root" notice that a naive grep miscounts as a 24th). So this gate is green the
  # day it lands. Making the 29 existing warnings fatal is a separate cleanup, and
  # bundling it here would have made the gate un-landable -- which is how a gate
  # ends up never being added at all. New errors of ANY rule still fail it (89
  # rules sit at error severity in broker-portal, 26 in admin-portal).
  #
  # Runs `npm run portal:lint` -- the same string the pre-push hook and PR-SOP 5.2
  # name -- rather than working-directory + `npm run lint`, so a green here and a
  # green on an engineer's machine are the same statement.
  broker-portal-lint:
    name: Broker Portal Lint
    needs: check-changes
    if: needs.check-changes.outputs.broker-portal-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Lint (broker-portal)
        run: npm run portal:lint

  # Mirror of broker-portal-lint for changes that do NOT touch broker-portal/**,
  # so the "Broker Portal Lint" status check is always reported. Exactly one of
  # the two runs.
  broker-portal-lint-skip:
    name: Broker Portal Lint
    needs: check-changes
    if: needs.check-changes.outputs.broker-portal-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no broker-portal changes)
        run: echo "Skipping broker-portal lint - no broker-portal/ changes detected"

  # BACKLOG-3099: same gate for admin-portal/. Separate job rather than a second
  # step on the broker job so one portal's failure cannot mask the other's, and
  # so each is scoped to its own portal's diff.
  #
  # admin-portal resolves a DIFFERENT eslint than broker-portal: it pins
  # eslint ^9 + eslint.config.mjs (flat config) in its own nested node_modules,
  # while the root tree carries eslint 8 (broker-portal/.eslintrc.json). `npm install` here
  # honours the lockfile and creates that nested install, so this job gets
  # eslint 9. A git worktree that symlinks only the ROOT node_modules does not,
  # and `next lint` there fails with "Invalid Options: Unknown options:
  # useEslintrc" -- the pre-push hook names the repair for that case.
  admin-portal-lint:
    name: Admin Portal Lint
    needs: check-changes
    if: needs.check-changes.outputs.admin-portal-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Lint (admin-portal)
        run: npm run admin:lint

  # Mirror of admin-portal-lint for changes that do NOT touch admin-portal/**.
  admin-portal-lint-skip:
    name: Admin Portal Lint
    needs: check-changes
    if: needs.check-changes.outputs.admin-portal-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no admin-portal changes)
        run: echo "Skipping admin-portal lint - no admin-portal/ changes detected"

  # BACKLOG-4090: type-check admin-portal. next.config.mjs sets
  # typescript.ignoreBuildErrors, so `next build` (and Vercel) never reports
  # type errors. The build runs FIRST: the page/route prop checks live in the
  # generated .next/types, which tsconfig.json includes and which exist only
  # after a build. tsc without them misses errors such as a wrong page-props
  # shape (TS2344). NEXT_PUBLIC_SUPABASE_* come from the tracked
  # admin-portal/.env.production; no secrets are needed to build.
  # Not a required check (244 sign-off on BACKLOG-4090).
  admin-portal-typecheck:
    name: Admin Portal Type Check
    needs: check-changes
    if: needs.check-changes.outputs.admin-portal-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build (admin-portal) to generate .next/types
        run: npm run build -w admin-portal
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Type check (admin-portal)
        run: npx tsc --noEmit -p admin-portal --incremental false

  # Mirror of admin-portal-typecheck for changes outside its filter.
  admin-portal-typecheck-skip:
    name: Admin Portal Type Check
    needs: check-changes
    if: needs.check-changes.outputs.admin-portal-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no admin-portal changes)
        run: echo "Skipping admin-portal type check - no admin-portal/ changes detected"

  # BACKLOG-4263: the offline python gates of the database test harnesses
  # (supabase/tests/backlog-4263-*, backlog-4266): call shape, call sites, each
  # folder's generator check, selftest and negative control, and the erase
  # harness check. Python standard library only, the runner's own python3, no
  # secret, no network after checkout, no database call. Not a required check
  # and in no aggregator's needs: a skipped run blocks nothing, so it has no
  # skip mirror. The shell-driven concurrency offline checks
  # (*/concurrency/offline_check.py, two-session/offline_check.py) are NOT run
  # here: they drive run.sh with signals and sleeps and have shown a timing
  # flake under load; they stay local.
  # Pushes to int-portal/** are excluded by this workflow's triggers, so on those
  # branches this job runs on pull requests only.
  harness-python-gates:
    name: Harness Python Gates
    needs: check-changes
    if: needs.check-changes.outputs.harness-tests-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run the harness python gates
        run: |
          # the shell runs with -e: every exit code is taken through `if`, so a red gate is recorded, not fatal
          set -uo pipefail
          T=supabase/tests
          python3 --version
          fail=0
          gate() {
            echo "::group::$*"
            if python3 -I "$@"; then rc=0; else rc=$?; fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::exit $rc: $*"; fail=1; fi
          }
          # a negative control must exit exactly 1; exit 0 means the selftest cannot fail
          negative() {
            if python3 -I "$@" > /dev/null 2>&1; then rc=0; else rc=$?; fi
            if [ "$rc" -eq 1 ]; then echo "negative control exits 1, as it must: $*"
            else echo "::error::negative control exited $rc, not 1: $*"; fail=1; fi
          }
          gate "$T/backlog-4263-sync2-t/call_shape.py" selftest
          gate "$T/backlog-4263-sync2-t/call_shape.py" sites
          gate "$T/backlog-4263-sync2-t/result_detail.py" selftest
          negative "$T/backlog-4263-sync2-t/result_detail.py" selftest --control-green-ok
          for d in backlog-4263-sync2-s1 backlog-4263-sync2-s2 backlog-4263-sync2-t backlog-4263-sync2-n backlog-4265 backlog-4266; do
            gate "$T/$d/gen.py" check
            gate "$T/$d/gen.py" selftest
            negative "$T/$d/gen.py" selftest --control-green-ok
          done
          gate "$T/backlog-4263-sync2-erase/harness.py" check
          gate "$T/backlog-4263-sync2-erase/harness.py" selftest
          negative "$T/backlog-4263-sync2-erase/harness.py" selftest --control-green-ok
          exit $fail

  # BACKLOG-2221: gate the Expo/React Native companion (android-companion/). It has
  # its own package-lock + jest/eslint/tsc but no root CI job covered it, so SMS
  # pipeline / crypto regressions went uncaught. Isolated job (own lockfile, no
  # native rebuild). Runs only when android-companion/** changed; the mirror-skip
  # job below keeps the status check name present on PRs that don't touch it — the
  # same docs-pass/test idiom used above.
  android-companion:
    name: Android Companion
    needs: check-changes
    if: needs.check-changes.outputs.android-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-companion
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: 'npm'
          cache-dependency-path: android-companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

  # Mirror of android-companion for PRs that do NOT touch android-companion/**, so
  # the "Android Companion" status check is always reported (ready to be made a
  # required check without blocking unrelated PRs). Exactly one of the two runs.
  android-companion-skip:
    name: Android Companion
    needs: check-changes
    if: needs.check-changes.outputs.android-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no android-companion changes)
        run: echo "Skipping android-companion checks - no android-companion changes detected"

  # BACKLOG-2956: `expo.version` sat at "1.0.0" across 54 commits and
  # `expo.android.versionCode` was never set at all. Expo silently defaults
  # versionCode to 1, so EVERY companion build ever produced identified itself as
  # version 1 — which is how a five-month-old debug APK reached a field tester
  # with no way to tell it apart from a build made that morning (BACKLOG-2955).
  #
  # Setting the numbers once fixed that day. This gate is what stops it recurring
  # when nobody remembers. It fails a PR that changes shipping code under
  # android-companion/ without bumping versionCode. Docs, tests and lint/type
  # config are exempt (see NON_SHIPPING in the script) so the rule stays narrow
  # enough that nobody is tempted to reach for --no-verify (BACKLOG-2837).
  #
  # fetch-depth: 0 + the explicit base fetch are required: the check diffs against
  # the MERGE BASE, so the branch is asked "do you bump it" rather than every
  # individual commit being asked.
  android-version-bump:
    name: Android Version Bump Gate
    needs: check-changes
    if: needs.check-changes.outputs.android-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch base branch for comparison
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
          else
            git fetch origin develop || true
          fi

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      # No npm install: the check reads git and two JSON files only.
      - name: Assert expo.android.versionCode was bumped
        env:
          GATE_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: npm run check:android-version

  # Mirror of android-version-bump for PRs that do NOT touch android-companion/**,
  # so the status check is always reported and can be made required without
  # blocking unrelated PRs. Exactly one of the two runs. Same shape as
  # android-companion / android-companion-skip above.
  android-version-bump-skip:
    name: Android Version Bump Gate
    needs: check-changes
    if: needs.check-changes.outputs.android-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no android-companion changes)
        run: echo "Skipping android version-bump gate - no android-companion changes detected"

  build:
    name: Build Application
    # BACKLOG-3198: matrix value stays macos-latest (it names the required check);
    # the runner is the pinned label in .github/macos-runner.json.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26' || matrix.os }}
    # BACKLOG-4125: needs both aggregators. On a feature-branch push only macOS
    # is in os-matrix, so test-windows is skipped; !cancelled() keeps this job
    # from being skipped with it, and the two OS terms keep today's rule: build
    # only when "Test & Lint" passed for every OS in os-matrix.
    needs: [check-changes, test-macos, test-windows]
    if: >-
      !cancelled() &&
      needs.check-changes.result == 'success' &&
      needs.check-changes.outputs.docs-only != 'true' &&
      (needs.test-macos.result == 'success' || !contains(needs.check-changes.outputs.os-matrix, 'macos-latest')) &&
      (needs.test-windows.result == 'success' || !contains(needs.check-changes.outputs.os-matrix, 'windows-latest'))

    strategy:
      # BACKLOG-3242: without this, `fail-fast` defaults to true and one platform's
      # failure CANCELS the other, so a single-platform problem destroys the signal
      # for both. On 2026-09-08 the macOS job failed and Windows was cancelled mid-run,
      # leaving no evidence of whether Windows would have built. Same form as the
      # jest shard jobs above, which carry it for the same reason.
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.check-changes.outputs.os-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      # BACKLOG-3242: this job's only output is the `dist/` upload below, and
      # `npm run build` is vite + tsc + a file copy + esbuild -- none of which load a
      # compiled native binary. Without ignore-scripts, `npm install` still ran the
      # native module's own install script (a from-source compile fallback) plus the
      # root postinstall's Electron-ABI rebuild, so the job did two builds of a module
      # it never uses and made two downloads it did not need. One of those downloads
      # timing out on 2026-09-08 failed the job and, via fail-fast, cancelled the other
      # platform. Skipping the scripts removes the work and the failure mode together.
      # Same form as the seven sibling jobs above. Jobs that DO need the native module
      # (`package` below, and the release workflow) are deliberately untouched.
      - name: Install dependencies
        run: npm install
        env:
          npm_config_ignore_scripts: true

      - name: Build Vite app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  # For docs-only changes, provide passing security check
  security-pass:
    name: Security Audit
    needs: check-changes
    if: needs.check-changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip security audit (docs-only change)
        run: echo "Skipping security audit - documentation-only changes detected"

  security:
    name: Security Audit
    needs: check-changes
    if: needs.check-changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'

      - name: Run npm audit
        # audit-level=critical: 72 known high/moderate vulnerabilities from transitive
        # dependencies (minimatch, ajv, tar, qs, next) tracked in BACKLOG-723.
        # None are critical. Will lower to --audit-level=high once dependencies are updated.
        #
        # BACKLOG-2265 made this step survive npm registry infra errors, using a grep list of
        # the specific failures visible that day (400 "endpoint is being retired", ECONNRESET,
        # ETIMEDOUT, ...). BACKLOG-3101: on 2026-09-04 the registry answered 503 three times.
        # A 5xx is the registry REPLYING, so no connection error fired and it was not a 400 --
        # the list matched nothing, and this REQUIRED check went red on develop with no
        # advisory involved. The list enumerated instances of a class.
        #
        # The decision now lives in scripts/ci/audit-guard.mjs, which keys on npm's own
        # "audit endpoint returned an error" line -- printed for every failure of that class
        # and never by an advisory report. It is a script rather than an inline block so it
        # can be fed canned transcripts: scripts/__tests__/auditGuard.test.ts runs it against
        # the real 503 and 400 logs and a real critical-advisory report. A real critical
        # vulnerability still fails this step.
        run: |
          set +e
          OUT=$(npm audit --audit-level=critical 2>&1); CODE=$?
          echo "$OUT"
          printf '%s\n' "$OUT" | node scripts/ci/audit-guard.mjs --npm-exit-code "$CODE"

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true

  # Package on main (production) and develop (staging) branches
  package:
    name: Package Application
    # BACKLOG-3198: matrix value stays macos-latest (it names the required check);
    # the runner is the pinned label in .github/macos-runner.json.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26' || matrix.os }}
    needs: [check-changes, test-macos, test-windows, build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.check-changes.outputs.docs-only != 'true'

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install

      # BACKLOG-4052: Electron 44 has no postinstall; the macOS build.mac.extraResources
      # read node_modules/electron/dist, which is absent until the binary is fetched.
      # (Windows takes its licence files from electron-builder's own Electron download.)
      - name: Download Electron binary and assert licence files
        if: matrix.os == 'macos-latest'
        run: node scripts/ci/ensure-electron-dist.js

      - name: Build application
        run: npm run build

      # BACKLOG-3438. This job packages UNSIGNED, exactly as the Windows job in the
      # same matrix already does. What CI asks of packaging is whether the app
      # packages at all, on both architectures, with nothing foreign inside it --
      # every question below reads the package's CONTENTS. The shippable artifact
      # is release.yml's, and release.yml keeps the signing, notarisation and
      # stapling along with the four checks that verify them.
      #
      # The branch that used to run here died on every run from 2026-09-07 and
      # this job reported success for eleven days: the pipeline's exit status was
      # `tee`'s, and the upload step defaulted to `warn` on zero files. Both of
      # those maskers are removed below -- do not reintroduce either.
      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: |
          # Without pipefail the status of `cmd | tee` is TEE's, which is always
          # 0, so a failed build cannot fail this step. That is how eleven days
          # of empty green runs happened (BACKLOG-3438). Keep this line first.
          set -o pipefail
          echo "Building unsigned macOS package (arm64 + x64)..."
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if ! npm run package:unsigned 2>&1 | tee package.log; then
            echo "::error::Unsigned package build failed. Check package.log for details."
            cat package.log
            exit 1
          fi
          echo ""
          echo "::group::Build Artifacts"
          ls -la release/*.dmg release/*.zip 2>/dev/null || echo "No package artifacts found"
          echo "::endgroup::"

      - name: Download and extract Apple drivers (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Downloading iTunes installer to extract Apple Mobile Device Support..."

          # Download iTunes installer
          $iTunesUrl = "https://www.apple.com/itunes/download/win64"
          $installerPath = "$env:TEMP\iTunes64Setup.exe"
          $extractPath = "$env:TEMP\iTunes-extracted"
          $targetPath = "resources\win\apple-drivers"

          echo "Downloading from $iTunesUrl..."
          Invoke-WebRequest -Uri $iTunesUrl -OutFile $installerPath -UseBasicParsing

          echo "Download complete. Size: $((Get-Item $installerPath).Length / 1MB) MB"

          # Extract using 7-Zip (pre-installed on GitHub runners)
          echo "Extracting with 7-Zip..."
          7z x $installerPath -o"$extractPath" -y

          # Find the MSI
          echo "Looking for AppleMobileDeviceSupport MSI..."
          $msi = Get-ChildItem -Path $extractPath -Recurse -Filter "AppleMobileDeviceSupport*.msi" | Select-Object -First 1

          if ($msi) {
            echo "Found: $($msi.FullName)"

            # Ensure target directory exists
            New-Item -ItemType Directory -Force -Path $targetPath | Out-Null

            # Copy MSI to resources
            Copy-Item $msi.FullName -Destination "$targetPath\AppleMobileDeviceSupport64.msi"

            # Create version file
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($msi.FullName).FileVersion
            if (-not $version) { $version = "unknown" }
            Set-Content -Path "$targetPath\version.txt" -Value $version

            echo "Apple drivers extracted successfully!"
            echo "MSI: $targetPath\AppleMobileDeviceSupport64.msi"
            echo "Version: $version"
          } else {
            echo "::warning::Could not find AppleMobileDeviceSupport MSI in extracted files"
            echo "Extracted contents:"
            Get-ChildItem -Path $extractPath -Recurse | Select-Object FullName
          }

          # Cleanup
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "Building Windows package..."
          npm run package:unsigned
          echo "Build complete. Checking artifacts..."
          Get-ChildItem -Path release -Filter "*.exe" | Format-Table Name, Length
        shell: pwsh

      # BACKLOG-3927: this is the website build, so Apple's installer must be in
      # it. (release.yml runs the same script for both channels; the Store
      # build must contain no driver payload at all.)
      - name: Verify the website package still bundles the Apple driver installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/ci/check-packaged-drivers.mjs release/win-unpacked website
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # BACKLOG-3814. scripts/afterPack.js places the pinned iPhone tools; check the
      # packaged copy is byte-identical to the manifest.
      - name: Verify the Windows package carries the pinned iPhone tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/release/pinnedIphoneTools.js --packaged release/win-unpacked
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # BACKLOG-3438. release.yml has asserted this since BACKLOG-3192 (release.yml
      # :225-251); ci.yml never did. A macOS build that dies partway leaves exactly
      # ONE pre-signature bundle behind, and the step above still exits 0 for every
      # reason except the one it was just taught. This is the step that says so.
      #
      # The two paths are named EXPLICITLY and must stay that way. Discovering
      # bundles under release/ would pass on a single bundle -- which is precisely
      # the broken state this exists to catch. electron-builder names the output
      # directory by TARGET architecture, not host, so `mac-arm64` and `mac` are
      # stable regardless of which runner image this lands on.
      - name: Verify both macOS architectures were packaged
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          FOUND=0
          for APP in release/mac-arm64/Keepr.app release/mac/Keepr.app; do
            if [ ! -d "$APP" ]; then
              echo "::error::Missing $APP -- the macOS packaging step did not complete both architectures"
              ls -la release/ || true
              exit 1
            fi
            FOUND=$((FOUND+1))
          done
          [ "$FOUND" -eq 2 ] || { echo "::error::Expected 2 .app bundles, found $FOUND"; exit 1; }

          # The upload below globs *.dmg and *.zip together, so `if-no-files-found`
          # fires only when BOTH are empty. Count them here instead: one DMG means
          # one architecture shipped, which is the failure this job missed for
          # eleven days.
          #
          # The `|| true` on each pipeline is load-bearing. An unmatched glob makes
          # `ls` exit non-zero, and under `set -eo pipefail` that ends the step
          # immediately -- red, but with no ::error:: line saying why, which is the
          # one case these counts exist to describe.
          DMGS=$(ls -1 release/*.dmg 2>/dev/null | wc -l | tr -d ' ' || true)
          ZIPS=$(ls -1 release/*.zip 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "Found $DMGS dmg, $ZIPS zip:"
          ls -la release/*.dmg release/*.zip || true
          [ "$DMGS" -eq 2 ] || { echo "::error::Expected 2 .dmg files, found $DMGS"; exit 1; }
          [ "$ZIPS" -eq 2 ] || { echo "::error::Expected 2 .zip files, found $ZIPS"; exit 1; }
          echo "OK: both architectures packaged."

      # BACKLOG-3425. This job runs on every push to develop and main, so it is the
      # EARLIER of the two gates -- a package that has swallowed the build's own output
      # fails here, days before anyone cuts a tag. release.yml runs the same check on the
      # signed artifacts. See scripts/ci/check-package-sanity.mjs for what it reads.
      - name: Verify the macOS packages contain no build output
        if: matrix.os == 'macos-latest'
        run: |
          node scripts/ci/check-package-sanity.mjs \
            --output-dir release --max-content-mb 400 --max-ratio 1.5 \
            release/mac-arm64/Keepr.app release/mac/Keepr.app

      - name: Verify the Windows package contains no build output
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/ci/check-package-sanity.mjs `
            --output-dir release --max-content-mb 400 `
            release/win-unpacked
          if ($LASTEXITCODE -ne 0) { Write-Error "Package sanity check failed"; exit 1 }

      # BACKLOG-3834. The packaged app must not ship a Google Maps key or its
      # variable name; release.yml runs the same check on the signed artifacts.
      - name: Verify the macOS packages ship no Google Maps key
        if: matrix.os == 'macos-latest'
        run: |
          for app in release/mac-arm64/Keepr.app release/mac/Keepr.app; do
            node scripts/ci/check-packaged-secrets.mjs mac "$app"
          done

      - name: Verify the Windows package ships no Google Maps key
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/ci/check-packaged-secrets.mjs win release/win-unpacked
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload macOS package artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
          # Default is `warn`. A build that produced nothing uploaded nothing and
          # reported success -- one of the two reasons this job went unnoticed for
          # eleven days (BACKLOG-3438). release.yml has set `error` since
          # BACKLOG-3192; this is the same line, finally ported.
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows package artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            release/*.exe
          retention-days: 30

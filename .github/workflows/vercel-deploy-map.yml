name: Vercel Deploy Map

# BACKLOG-2833 — assert the shape of git.deploymentEnabled in both portal
# vercel.json files.
#
# ## Why this is guarded at all
#
# The "**": false catch-all must be the LAST key. Measured on a single-variable
# pair (refs evidence/BACKLOG-2833-catchall-first and -catchall-last, same
# parent, the only difference being that key's position): written FIRST, a
# branch that an allow key matches was denied on both portals; written LAST it
# deployed. Vercel's docs describe order-independent semantics, so they are not
# a safe guide on this surface.
#
# ## Why it needs CI rather than a comment
#
# JSON has no comment syntax, so the rule cannot travel with the file — an
# earlier revision of this PR claimed it did, and that claim was false.
#
# More importantly the regression is SILENT. A branch that deploymentEnabled
# denies produces no Vercel deployment and therefore NO GitHub commit status:
# not a red check, not an error, nothing. A jq round-trip, an editor's "sort
# object keys", a merge resolution, or json.dumps(sort_keys=True) reorders the
# keys and turns default-deny into deny-everything — main and develop included —
# with no visible symptom anywhere. Nothing else in this repo reads
# deploymentEnabled.
#
# ## Why its own workflow and not a job in ci.yml
#
# Two reasons. ci.yml gates most jobs behind a check-changes path filter, and a
# job that is skipped never creates a check run, so it cannot be made a required
# check (BACKLOG-3075). And ci.yml is edited concurrently by other branches —
# PR #2541 adds a job to it against this same base — so a standalone file has no
# collision surface. Same reasoning as message-hygiene.yml.
#
# ## What else it asserts (BACKLOG-3205)
#
# "*-portal/**" must be true, and "int/**" / "hotfix/**" must not be. Plain
# integration and hotfix branches are not deployed; portal work on them opts in
# by branch name (int-portal/<name>, hotfix-portal/<name>). The Portal Branch
# Name workflow is the red check for a plain branch that carries portal changes.
#
# Cheap: ubuntu, no install, no node_modules, no build.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vercel-deploy-map:
    name: Vercel Deploy Map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Assert the catch-all is present, false, and last
        run: node scripts/ci/check-vercel-deploy-map.mjs

      - name: Verify the guard itself
        run: node scripts/__tests__/check-vercel-deploy-map.verify.js

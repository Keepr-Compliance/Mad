name: PR Metrics Validation

# This workflow enforces the Engineer Workflow Compliance requirements
# by validating that PRs carry the linkage needed for metrics attribution.
#
# Requirements (Updated 2026-07-07, BACKLOG-1873):
# 1. Engineer Metrics section must be present
# 2. Agent ID must be present (linkage key into pm_token_metrics)
# 3. Task/Backlog cross-reference (TASK-#### or BACKLOG-####) must be present
# 4. The Public Repository Notice must be present VERBATIM (BACKLOG-3133) --
#    an exact-string test, because "try not to describe vulnerabilities" passes
#    every keyword check and is not the rule.
#
# Numeric metrics (Total Tokens, Duration, API Calls, Variance) are NOT
# validated in the PR body: they are auto-captured by the SubagentStop hook
# into Supabase pm_token_metrics AFTER the agent finishes, so PR-time values
# were always placeholders. Supabase is the sole numeric store
# (pm_token_metrics; pm_backlog_items.branch_name / pr_url / est / actual).
#
# Exceptions:
# - Dependabot PRs are exempt (automated dependency updates)
# - PRs with [skip-metrics] in title are exempt (use sparingly)
# - PRs with 'hotfix', 'quick-fix', or 'ci-fix' labels are exempt
# - Non-engineer head branches are exempt, by prefix (see "Check for skip flag")
#
# Head-branch exemptions exist because the Agent ID is an attribution key for
# ONE engineer agent's pm_token_metrics row. A PR that is not one agent's work
# has no honest id to cite, and Check 2 is a substring match with no existence
# test — so the cheapest way to satisfy it is to invent one. PR #2295 cited
# 'a0d1a15d2ff4f0d40', which has zero rows in pm_token_metrics. The exemptions
# below are deliberately narrow: they name branch prefixes that CANNOT be an
# engineer task branch (fix/, feat/, feature/, docs/, test/, claude/ and bare
# chore/ all still fail without an Agent ID).

on:
  pull_request:
    branches: [main, develop, 'int/**', 'int-portal/**']
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-metrics:
    name: Validate PR Metrics
    runs-on: ubuntu-latest

    # Skip for Dependabot PRs
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Check for exempt labels
        id: label-check
        env:
          # Passed via env (not inline ${{ }} in run:) to prevent template injection
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Check if PR has any exempt labels
          echo "Labels on PR: $LABELS"

          if echo "$LABELS" | grep -qiE '"(hotfix|quick-fix|ci-fix)"'; then
            echo "exempt=true" >> $GITHUB_OUTPUT
            echo "::notice::Metrics validation skipped - exempt label detected"
          else
            echo "exempt=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for skip flag
        id: skip-check
        env:
          # The TITLE is fetched too, for the same reason as the body below: a
          # title can be edited, and the Actions log keeps the version that was
          # current when the run happened. PR #2524's title was changed for
          # exactly this reason on 2026-09-06. (BACKLOG-3133)
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -e
          echo "Head branch: $HEAD_REF"

          # THREE ATTEMPTS, then fail closed. `bash -e` makes a single transient
          # 5xx or one rate-limit window red this PR with a message its author
          # cannot act on, and a check whose failures are not actionable is the
          # one people learn to ignore. Writes to a `.part` file and moves it
          # only on success, so a half-written response is never read back.
          gh_api_retry() {
            dest="$1"
            shift
            attempt=0
            while [ "$attempt" -lt 3 ]; do
              attempt=$((attempt + 1))
              if gh api "$@" > "$dest.part" 2> "$dest.err"; then
                mv "$dest.part" "$dest"
                return 0
              fi
              echo "gh api attempt $attempt of 3 failed."
              # First line only, from gh's own stderr. An API error is
              # 'gh: Not Found (HTTP 404)'-shaped; a whole response could carry
              # the PR body, which is the thing BACKLOG-3133 keeps out of logs.
              head -n 1 "$dest.err" || true
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            echo "::error title=Validate PR Metrics::Could not read the pull request from the API after 3 attempts. Infrastructure failure, not a metrics finding — re-run the job."
            return 1
          }

          gh_api_retry "$RUNNER_TEMP/pr-title.txt" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.title'
          PR_TITLE="$(cat "$RUNNER_TEMP/pr-title.txt")"

          if [[ "$HEAD_REF" == int/* || "$HEAD_REF" == int-portal/* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=integration branch (int/*, int-portal/*)" >> $GITHUB_OUTPUT
            echo "::notice::Metrics validation skipped - integration branch (int/*, int-portal/*) combines multiple tasks"
          elif [[ "$HEAD_REF" == squash/* ]]; then
            # PM squash/aggregate PRs (BACKLOG-2685). A squash collapses many
            # agents' commits into one; there is no single engineer to attribute
            # and no pm_token_metrics row that could honestly be cited. Example:
            # PR #2300 squashed 429 commits from dozens of agents.
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=PM squash branch (squash/*)" >> $GITHUB_OUTPUT
            echo "::notice::Metrics validation skipped - PM squash branch (squash/*) aggregates many agents' commits; no single engineer to attribute"
          elif [[ "$HEAD_REF" == chore/ci-* ]]; then
            # CI-configuration PRs (BACKLOG-2685). Same class the pre-existing
            # 'ci-fix' exempt label already covers; the prefix makes it apply
            # without a label round-trip (the workflow does not run on 'labeled').
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=CI configuration branch (chore/ci-*)" >> $GITHUB_OUTPUT
            echo "::notice::Metrics validation skipped - CI configuration branch (chore/ci-*)"
          elif [[ "$PR_TITLE" == *"[skip-metrics]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=title flag" >> $GITHUB_OUTPUT
            echo "::warning::Metrics validation skipped via [skip-metrics] flag"
          elif [[ "${{ steps.label-check.outputs.exempt }}" == "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=exempt label" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
          fi

      - name: Validate Engineer Metrics Section
        id: validate
        if: steps.skip-check.outputs.skip != 'true'
        env:
          # The body is FETCHED, not handed in through `env:`. (BACKLOG-3133)
          #
          # This step used to carry `PR_BODY: ${{ github.event.pull_request.body }}`.
          # That is injection-safe and DISCLOSURE-UNSAFE: the runner prints the
          # resolved `env:` block into the step log, so the whole PR description
          # was republished verbatim into a log that on this PUBLIC repository is
          # world-readable and survives every later edit of that description.
          #
          # Measured: the log for this workflow's 2026-09-06T02:46:13Z run on
          # PR #2524 still carries that PR's pre-rewrite body — the revision the
          # SR blocked over — and the run page answers an unauthenticated GET
          # with HTTP 200. Editing the description did not touch it. Deleting the
          # workflow run is the self-service remedy, and that is the founder's
          # call, not this workflow's.
          #
          # Injection safety is unchanged: only the PR number travels through
          # `env:`, and nothing author-controlled is interpolated into `run:`.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "=== Validating PR Metrics ==="
          echo ""

          # THREE ATTEMPTS, then fail closed. `bash -e` makes a single transient
          # 5xx or one rate-limit window red this PR with a message its author
          # cannot act on, and a check whose failures are not actionable is the
          # one people learn to ignore. Writes to a `.part` file and moves it
          # only on success, so a half-written response is never read back.
          gh_api_retry() {
            dest="$1"
            shift
            attempt=0
            while [ "$attempt" -lt 3 ]; do
              attempt=$((attempt + 1))
              if gh api "$@" > "$dest.part" 2> "$dest.err"; then
                mv "$dest.part" "$dest"
                return 0
              fi
              echo "gh api attempt $attempt of 3 failed."
              # First line only, from gh's own stderr. An API error is
              # 'gh: Not Found (HTTP 404)'-shaped; a whole response could carry
              # the PR body, which is the thing BACKLOG-3133 keeps out of logs.
              head -n 1 "$dest.err" || true
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            echo "::error title=Validate PR Metrics::Could not read the pull request from the API after 3 attempts. Infrastructure failure, not a metrics finding — re-run the job."
            return 1
          }

          # Read the body from a file rather than an env var, so it never
          # appears in the step's printed environment.
          gh_api_retry "$RUNNER_TEMP/pr-body.txt" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""'
          PR_BODY="$(cat "$RUNNER_TEMP/pr-body.txt")"
          echo "body bytes: $(wc -c < "$RUNNER_TEMP/pr-body.txt")"
          echo ""

          # Check 1: Engineer Metrics section exists
          echo "Check 1: Engineer Metrics section..."
          if [[ ! "$PR_BODY" =~ "## Engineer Metrics" ]]; then
            echo "::error::PR missing '## Engineer Metrics' section"
            echo "  Add the Engineer Metrics section to your PR description."
            echo "  See .github/PULL_REQUEST_TEMPLATE.md for the required format."
            exit 1
          fi
          echo "  [PASS] Engineer Metrics section found"

          # Check 2: Agent ID present (linkage key into pm_token_metrics)
          echo ""
          echo "Check 2: Agent ID..."
          if [[ ! "$PR_BODY" =~ "Agent ID" ]] && [[ ! "$PR_BODY" =~ "Engineer Agent ID" ]]; then
            echo "::error::PR missing 'Agent ID'"
            echo "  Add your agent_id — it is the linkage key for pm_token_metrics lookups."
            echo "  See .github/PULL_REQUEST_TEMPLATE.md for the required format."
            exit 1
          fi
          echo "  [PASS] Agent ID found"

          # Check 3: Task/Backlog cross-reference (TASK-#### or BACKLOG-####)
          echo ""
          echo "Check 3: Task/Backlog cross-reference..."
          if [[ ! "$PR_BODY" =~ (TASK|BACKLOG)-[0-9]+ ]]; then
            echo "::error::PR missing task/backlog cross-reference"
            echo "  Reference the driving item as TASK-#### or BACKLOG-#### in the PR body."
            echo "  Every PR must be traceable to a pm_backlog_items row."
            exit 1
          fi
          echo "  [PASS] Task/Backlog cross-reference found"

          # Check 4: the locked Public Repository Notice, VERBATIM (BACKLOG-3133)
          #
          # An EXACT-string test, not a keyword test. The point is that the
          # sentence cannot be softened. "Try not to describe vulnerabilities"
          # and "Do not describe vulnerabilities" both contain every word a
          # keyword check would look for; only one of them is the rule.
          #
          # `grep -F` on a here-string rather than a bash `=~` match: the
          # sentence contains no regex metacharacters today, but a future edit
          # to it would silently turn one into a wildcard and weaken the check
          # without anyone touching this file.
          echo ""
          echo "Check 4: Public Repository Notice (verbatim)..."
          NOTICE='This repository is public. Do not describe vulnerabilities, addresses, credentials, endpoints, or network layout here. Link the backlog item.'
          if ! printf '%s' "$PR_BODY" | grep -qF -- "$NOTICE"; then
            echo "::error::PR body is missing the Public Repository Notice, or it has been altered"
            echo "  The PR body must contain this sentence, exactly, unaltered:"
            echo ""
            echo "    $NOTICE"
            echo ""
            echo "  It is a fixed sentence and not a checkbox because a checkbox gets"
            echo "  ticked. On 2026-09-03 and 2026-09-06 an agent wrote accurate security"
            echo "  detail into a commit message and a PR body having read the prose rule"
            echo "  minutes earlier (BACKLOG-3087, BACKLOG-3114)."
            echo ""
            echo "  Copy it from .github/PULL_REQUEST_TEMPLATE.md. Do not reword it."
            exit 1
          fi
          echo "  [PASS] Public Repository Notice present and unaltered"

          echo ""
          echo "Note: numeric metrics are auto-captured to Supabase pm_token_metrics"
          echo "by the SubagentStop hook and are NOT validated in the PR body (BACKLOG-1873)."
          echo ""
          echo "=== All metrics validations passed ==="

      - name: Summary
        if: always()
        env:
          # Workflow-controlled values, but passed via env for consistency with
          # the injection-safe pattern used above.
          SKIPPED: ${{ steps.skip-check.outputs.skip }}
          SKIP_REASON: ${{ steps.skip-check.outputs.skip_reason }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [[ "$SKIPPED" == "true" ]]; then
            echo "## PR Metrics Validation: SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Report the reason that actually fired. Previously every non-label
            # skip was reported as "[skip-metrics] flag in PR title", which was
            # already false for int/* skips (BACKLOG-2685).
            echo "Reason: **${SKIP_REASON}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            case "$SKIP_REASON" in
              "exempt label")
                echo "> **Note**: Exempt labels (hotfix/quick-fix/ci-fix) are appropriate for urgent fixes that bypass the sprint workflow." >> $GITHUB_STEP_SUMMARY
                ;;
              "title flag")
                echo "> **Note**: Use [skip-metrics] sparingly. All sprint tasks should include metrics." >> $GITHUB_STEP_SUMMARY
                ;;
              *)
                echo "> **Note**: This head branch is not an engineer task branch, so there is no single agent_id to attribute. Engineer branches still require an Agent ID." >> $GITHUB_STEP_SUMMARY
                ;;
            esac
          elif [[ "$VALIDATE_OUTCOME" == "success" ]]; then
            echo "## PR Metrics Validation: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All required sections are present:" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Engineer Metrics section" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Agent ID (pm_token_metrics linkage key)" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Task/Backlog cross-reference" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Public Repository Notice (verbatim)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Numeric metrics live in Supabase \`pm_token_metrics\` (auto-captured — BACKLOG-1873)." >> $GITHUB_STEP_SUMMARY
          else
            # Previously this branch printed "PASSED" whenever the job was not
            # skipped — including when validation had just FAILED. Observed on
            # run 31569375378 (PR #2300): the job failed and the summary said
            # PASSED (BACKLOG-2685).
            echo "## PR Metrics Validation: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Read the **Validate Engineer Metrics Section** step log for which check failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> See \`.github/PULL_REQUEST_TEMPLATE.md\` for the required format." >> $GITHUB_STEP_SUMMARY
          fi

name: Migration Validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      # A change to either checker must itself be checked.
      - 'scripts/lint-migrations.sh'
      - 'scripts/check-migration-names.mjs'

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Validate migration files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/lint-migrations.sh

      # Owns naming and duplicate-stamp enforcement. Runs over the WHOLE directory,
      # not just changed files: a duplicate is a property of the set, so a PR that
      # adds one file can only be judged against every other file's stamp.
      - name: Check migration names and version stamps
        run: node scripts/check-migration-names.mjs

<mws-header>
  <mw-conversation-header>
    <div data-e2e-header-title><h2>Test Contact A</h2></div>
  </mw-conversation-header>
</mws-header>

<mws-messages-list>
  <mws-tombstone-message-wrapper>
    <div>Test Contact A is using RCS chat</div>
  </mws-tombstone-message-wrapper>

  <!-- 1. Incoming, observed shape. The text contains "on" and a period on purpose. Two reactions (see header). -->
  <mws-message-wrapper data-e2e-message-wrapper class="incoming" is-outgoing="false" msg-id="101">
    <div data-e2e-message-wrapper-core class="msg-row incoming" data-e2e-message-outgoing="false" data-e2e-message-rcs="false" data-e2e-message-id="101">
      <mws-text-message-part class="msg-focus-element" aria-label="Test Contact A said: It was sent on Monday at 3:00 PM. Thanks. Received on September 20, 2026 at 9:05 AM. Test Contact A reacted with angry. You reacted with sad.">
        <div data-e2e-text-message-content class="text-msg-container incoming">
          <mws-message-part-content data-e2e-message-content>It was sent on Monday at 3:00 PM. Thanks.</mws-message-part-content>
        </div>
      </mws-text-message-part>
      <mw-message-reactions-display>
        <span class="reaction" data-e2e-reaction data-e2e-reaction-emoji="😡">😡</span>
        <span class="reaction" data-e2e-reaction data-e2e-reaction-emoji="😢">😢</span>
      </mw-message-reactions-display>
    </div>
  </mws-message-wrapper>

  <!-- 2. Outgoing, observed shape, RCS flag true -->
  <mws-message-wrapper data-e2e-message-wrapper class="outgoing" is-outgoing="true" msg-id="102">
    <div data-e2e-message-wrapper-core class="msg-row outgoing" data-e2e-message-outgoing="true" data-e2e-message-rcs="true" data-e2e-message-id="102">
      <mws-text-message-part class="msg-focus-element" aria-label="You said: Reply number two. Sent on September 28, 2026 at 4:30 PM. SMS.">
        <div data-e2e-text-message-content class="text-msg-container outgoing">
          <mws-message-part-content data-e2e-message-content>Reply number two</mws-message-part-content>
        </div>
      </mws-text-message-part>
    </div>
  </mws-message-wrapper>

  <!-- 3. UNVERIFIED: incoming reply quoting message 2 ("Today"); only its own text counts -->
  <mws-message-wrapper data-e2e-message-wrapper class="incoming" is-outgoing="false" msg-id="103">
    <div data-e2e-message-wrapper-core class="msg-row incoming" data-e2e-message-outgoing="false" data-e2e-message-rcs="false" data-e2e-message-id="103">

        <mws-text-message-part class="msg-focus-element" aria-label="You said: Reply number two. Sent on September 28, 2026 at 4:30 PM.">
          <mws-message-part-content data-e2e-message-content>Reply number two</mws-message-part-content>
        </mws-text-message-part>
      </div>
      <mws-text-message-part class="msg-focus-element" aria-label="Test Contact A said: Answer three. Received on Today at 8:15 AM.">
        <div data-e2e-text-message-content class="text-msg-container incoming">
          <mws-message-part-content data-e2e-message-content>Answer three</mws-message-part-content>
        </div>
      </mws-text-message-part>
    </div>
  </mws-message-wrapper>

  <!-- 4. Outgoing, observed shape, two-digit hour PM -->

    <div data-e2e-message-wrapper-core class="msg-row outgoing" data-e2e-message-outgoing="true" data-e2e-message-rcs="false" data-e2e-message-id="104">

          <mws-message-part-content data-e2e-message-content>Fourth line</mws-message-part-content>

    </div>
  </mws-message-wrapper>

    <div data-e2e-message-wrapper-core class="msg-row incoming" data-e2e-message-outgoing="false" data-e2e-message-rcs="false" data-e2e-message-id="105">

    </div>

</mws-messages-list>
